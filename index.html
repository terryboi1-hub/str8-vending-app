<!doctype html>

<style>
:root{--bg:#07101c;--panel:#142033;--panel2:#0c1728;--line:#344763;--text:#fff;--muted:#aab6c9;--accent:#b52543;--accent2:#8e1d36;--gold:#e1a535;--green:#9df1bf;--red:#ff9dad;--blue:#9ecbff}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.subcard{background:var(--panel2);border:1px solid #31435e;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wraprow{flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:12px}.good{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}h1,h2,h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;text-align:center}.btn.secondary{background:#253753}.btn.good{background:#17613d}.btn.warn{background:#70500f}.btn.danger{background:#7f1d1d}.btn.smallbtn{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.input,input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #425571;background:#0b1525;color:#fff}textarea{min-height:80px}.grid2,.grid3,.grid4{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}.nav button{white-space:nowrap;border:1px solid #425571;background:#17243a;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.nav button.active{background:var(--accent)}.stat{background:var(--panel2);border:1px solid #31435e;border-radius:14px;padding:12px}.stat b{font-size:22px;display:block;margin-top:3px}.product{display:grid;grid-template-columns:70px 1fr auto;gap:11px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.photo{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#09111e;border:1px solid #425571}.photo.placeholder{display:grid;place-items:center;font-size:30px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#253753;font-size:11px;font-weight:800}.pill.good{background:#163e2b}.pill.warn{background:#5a4012}.pill.bad{background:#541928}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(900px,100%);max-height:94vh;overflow:auto;background:#111c2d;border-radius:18px 18px 0 0;padding:16px}.label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c2d;border:1px solid #425571;border-radius:12px;padding:12px 16px;z-index:100;display:none;max-width:90%}.toast.show{display:block}.scanner{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center;padding:14px}.scanner.open{display:flex}.scanner-panel{width:min(700px,100%);background:#111c2d;border-radius:16px;padding:14px}.reader{min-height:280px;background:#05080d;border-radius:12px;overflow:hidden}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(460px,100%)}.hidden{display:none!important}.offline{background:#70500f;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.online{background:#17613d;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.route-stop{border-left:4px solid var(--accent);padding-left:12px}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:auto}.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}.searchbar{display:grid;grid-template-columns:2fr 1fr;gap:8px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:760px){.grid4,.grid3,.grid2{grid-template-columns:1fr}.product{grid-template-columns:58px 1fr}.product>.actions{grid-column:1/-1}.photo{width:58px;height:58px}.searchbar{grid-template-columns:1fr}.wrap{padding:10px}.sheet{border-radius:18px 18px 0 0}}
@media(min-width:761px){.modal{align-items:center}.sheet{border-radius:18px}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="card">
    <h1>STR8 Vending</h1><div class="muted">Cloud operations, inventory, orders, routes and sales.</div>
    <label class="label">Email</label><input id="loginEmail" type="email" placeholder="owner@stbdistribution.com" autocomplete="username">
    <label class="label">Password</label><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:12px">Sign In</button>
    <button class="btn secondary" id="resetPasswordBtn" style="width:100%;margin-top:8px">Reset Password</button>
    <button class="btn secondary" id="demoBtn" style="width:100%;margin-top:8px">Open Demo Mode</button>
    <div id="loginMsg" class="small muted" style="margin-top:10px"></div>
  </div>
</div>
<div id="app" class="wrap hidden">
  <div class="sticky">
    <div class="card">
      <div class="row wraprow"><div><h2>STR8 Vending</h2><div id="userLine" class="small muted"></div></div><div class="actions"><span id="networkBadge" class="online">Online</span><button class="btn secondary smallbtn" id="syncBtn">Sync</button><button class="btn secondary smallbtn" id="messagesBtn">Messages <span id="headerMessageCount" class="pill warn hidden" style="margin-left:4px">0</span></button><button class="btn danger smallbtn" id="logoutBtn">Log Out</button></div></div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div id="content"></div>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h3 id="modalTitle">Edit</h3><button class="btn secondary smallbtn" id="closeModal">Close</button></div><div id="modalBody"></div><div class="actions" style="margin-top:14px"><button class="btn" id="saveModal">Save</button></div></div></div>
<div id="scanner" class="scanner"><div class="scanner-panel"><div class="row"><div><h3>Scan Barcode</h3><div class="small muted">Point your camera at the UPC or barcode.</div></div><button class="btn secondary smallbtn" id="closeScanner">Close</button></div><div id="reader" class="reader"></div><label class="label">Manual barcode</label><div class="grid2"><input id="manualBarcode" inputmode="numeric" placeholder="Type barcode"><button class="btn" id="useBarcode">Use Barcode</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://ijbyfxxykueujunshtsy.supabase.co';
const SUPABASE_KEY='sb_publishable_5nrx2r9mdJ_nbitdZHcMrw_uWZtrnYw';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const LS='str8_vending_enterprise_v3'; const BACKUPS='str8_vending_backups_v1';
const roles={owner:['dashboard','machines','inventory','orders','routes','sales','issues','prospects','activity','settings'],manager:['dashboard','machines','inventory','orders','routes','sales','issues','prospects','activity'],warehouse:['dashboard','inventory','orders','issues'],route:['dashboard','machines','routes','sales','issues'],sales:['dashboard','orders','prospects']};
const labels={dashboard:'Dashboard',machines:'Machines',inventory:'Inventory',orders:'Orders',routes:'Routes',sales:'Sales',issues:'Issues',prospects:'Prospects',activity:'Activity',settings:'Settings'};
let user=null,profile=null,demo=false,currentPage='dashboard',modalSave=null,scannerCallback=null,scannerObj=null;
function starter(){return {version:3,updatedAt:'1970-01-01T00:00:00.000Z',products:[
{id:'p1',sku:'COKE20',barcode:'049000050103',name:'Coke 20 oz',category:'Drink',cost:1.05,price:2.50,onHand:48,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true},
{id:'p2',sku:'SPRITE20',barcode:'049000050202',name:'Sprite 20 oz',category:'Drink',cost:1.05,price:2.50,onHand:36,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true},
{id:'p3',sku:'CHIPS1',barcode:'028400090896',name:'Classic Chips',category:'Snack',cost:.62,price:1.50,onHand:60,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true}],machines:[],machineStock:[],customers:[],orders:[],routes:[],sales:[],issues:[],prospects:[],activity:[],settings:{company:'STR8 TO BUSINESS LLC',lowStock:true,currency:'USD'},pendingSync:false,lastSync:null};}
let state=loadState();
function loadState(){try{return Object.assign(starter(),JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){return starter();}}
function persist(logText,entity,entityId){state.updatedAt=new Date().toISOString();state.pendingSync=true;localStorage.setItem(LS,JSON.stringify(state));if(logText)logActivity(logText,entity,entityId,false);renderNetwork();}
function logActivity(action,entity='',entityId='',doPersist=true){state.activity.unshift({id:uid(),at:new Date().toISOString(),user:profile?.email||user?.email||'demo',role:profile?.role||'demo',action,entity,entityId});state.activity=state.activity.slice(0,1000);if(doPersist){state.pendingSync=true;localStorage.setItem(LS,JSON.stringify(state));}}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return '$'+Number(v||0).toFixed(2)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function confirmDelete(name){return confirm('Delete '+name+'? This cannot be undone.');}
function role(){return profile?.role||'owner'}
function can(page){return (roles[role()]||roles.owner).includes(page)}
function isManagement(){return ['owner','manager'].includes(role())}
function isWarehouse(){return role()==='warehouse'}
function isDriver(){return role()==='route'}
function canCreateOrders(){return ['owner','manager','sales'].includes(role())}
function canPickOrders(){return ['owner','manager','warehouse'].includes(role())}
function renderNav(){document.getElementById('nav').innerHTML=(roles[role()]||roles.owner).filter(p=>p!=='messages').map(p=>`<button data-page="${p}" class="${p===currentPage?'active':''}">${labels[p]}</button>`).join('');updateHeaderMessages();}
function updateHeaderMessages(){const btn=document.getElementById('messagesBtn'),badge=document.getElementById('headerMessageCount');if(!btn||!badge)return;const allowed=can('messages');btn.classList.toggle('hidden',!allowed);let unread=0;try{ensureMessagingState();unread=(state.messages||[]).filter(messageUnread).length;}catch(e){}badge.textContent=String(unread);badge.classList.toggle('hidden',unread===0);btn.classList.toggle('active',currentPage==='messages');}
function render(){if(!can(currentPage))currentPage=(roles[role()]||roles.owner)[0];renderNav();const fn=pages[currentPage]||pages.dashboard;document.getElementById('content').innerHTML=fn();bindPage();}
function renderNetwork(){const b=document.getElementById('networkBadge');if(!b)return;const on=navigator.onLine;b.textContent=on?(state.pendingSync?'Online • Unsynced':'Online • Synced'):'Offline Mode';b.className=on?'online':'offline';}
function bindPage(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>actions[el.dataset.action]?.(el.dataset));document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{currentPage=el.dataset.page;render();});}
function openModal(title,html,onSave,saveLabel='Save'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('saveModal').textContent=saveLabel;modalSave=onSave;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');modalSave=null;}
async function compressImage(file,max=700,quality=.75){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w*=s;h*=s;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=r.result;};r.readAsDataURL(file);});}
async function startScanner(cb){scannerCallback=cb;document.getElementById('scanner').classList.add('open');document.getElementById('manualBarcode').value='';if(window.Html5Qrcode){try{scannerObj=new Html5Qrcode('reader');await scannerObj.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},code=>finishScan(code));}catch(e){toast('Camera unavailable. Type the barcode instead.');}}}
async function stopScanner(){if(scannerObj){try{await scannerObj.stop();await scannerObj.clear();}catch(e){}scannerObj=null;}document.getElementById('scanner').classList.remove('open');}
async function finishScan(code){const cb=scannerCallback;await stopScanner();scannerCallback=null;if(cb)cb(String(code).trim());}
function productPhoto(p){return p.photo?`<img class="photo" src="${p.photo}" alt="${esc(p.name)}">`:`<div class="photo placeholder">📦</div>`}
function totals(){const sales=state.sales.reduce((a,s)=>a+Number(s.cash||0)+Number(s.card||0),0);const cogs=state.sales.reduce((a,s)=>a+Number(s.cost||0),0);const commission=state.sales.reduce((a,s)=>a+Number(s.commission||0),0);return {sales,cogs,commission,profit:sales-cogs-commission};}
const pages={
dashboard(){const t=totals();const low=state.products.filter(p=>p.active!==false&&Number(p.onHand)<=Number(p.reorder));const open=state.orders.filter(o=>!['Checked In','Cancelled'].includes(o.status));const route=state.routes.filter(r=>r.status!=='Completed');return `<div class="grid4"><div class="stat"><span class="muted">Machines</span><b>${state.machines.length}</b></div><div class="stat"><span class="muted">Low Stock</span><b class="${low.length?'bad':'good'}">${low.length}</b></div><div class="stat"><span class="muted">Open Orders</span><b>${open.length}</b></div><div class="stat"><span class="muted">Net Profit</span><b class="good">${money(t.profit)}</b></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Needs Attention</h3>${low.length?low.slice(0,8).map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="bad">${p.onHand} left</b></div>`).join(''):'<div class="empty">No low-stock products.</div>'}</div><div class="card"><h3>Next Work</h3><div class="row"><span>Orders waiting</span><b>${open.length}</b></div><div class="row"><span>Routes active</span><b>${route.length}</b></div><div class="row"><span>Open issues</span><b>${state.issues.filter(i=>i.status!=='Resolved').length}</b></div><div class="row"><span>Unsynced changes</span><b>${state.pendingSync?'Yes':'No'}</b></div></div></div>`;},
machines(){return `<div class="card"><div class="row wraprow"><div><h3>Machines</h3><div class="small muted">Drivers service machines, update stock, record sales and report issues.</div></div>${isManagement()?'<button class="btn" data-action="addMachine">Add Machine</button>':''}</div>${state.machines.length?state.machines.map(m=>{const stock=state.machineStock.filter(x=>x.machineId===m.id);const value=stock.reduce((a,x)=>{const p=state.products.find(p=>p.id===x.productId);return a+Number(x.qty||0)*Number(p?.price||0)},0);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(m.name)}</b><div class="small muted">${esc(m.location||'No location')} • ${esc(m.address||'')}</div><div class="small">Status: <span class="pill ${m.status==='Active'?'good':'warn'}">${esc(m.status)}</span> • Stock value ${money(value)}</div></div><div class="actions">${isManagement()?`<button class="btn secondary smallbtn" data-action="editMachine" data-id="${m.id}">Edit Details</button>`:''}<button class="btn smallbtn" data-action="editStock" data-id="${m.id}">Update Machine Stock</button>${isManagement()?`<button class="btn danger smallbtn" data-action="deleteMachine" data-id="${m.id}">Delete</button>`:''}</div></div></div>`}).join(''):'<div class="empty">No machines yet.</div>'}</div>`;},
inventory(){const q='';return `<div class="card"><div class="row wraprow"><div><h3>Inventory</h3><div class="small muted">Receive shipments, scan products, and manage warehouse stock.</div></div><div class="actions"><button class="btn good" data-action="receiveShipment">Receive Shipment</button><button class="btn" data-action="scanInventoryProduct">Scan Product</button><button class="btn secondary" data-action="manualInventoryBarcode">Manual Barcode</button><button class="btn secondary" data-action="addProduct">Add Product</button><button class="btn secondary" data-action="exportInventory">Export CSV</button></div></div><div class="subcard"><b>Warehouse Receiving</b><div class="small muted">Scan a UPC with your phone camera or type it manually, enter the exact quantity received, then add it to warehouse inventory.</div></div><div class="searchbar"><input id="inventorySearch" placeholder="Search product, SKU or barcode"><select id="inventoryFilter"><option value="all">All products</option><option value="low">Low stock</option><option value="inactive">Inactive</option></select></div><div id="inventoryList">${inventoryList('','all')}</div></div>`;},
orders(){return `<div class="card"><div class="row wraprow"><div><h3>${isWarehouse()?'Warehouse Picking':'Orders'}</h3><div class="small muted">${isWarehouse()?'Pick and scan every item, then mark the order Ready for the driver.':'Create orders and send them to the warehouse for picking.'}</div></div><div class="actions">${canCreateOrders()?'<button class="btn" data-action="newOrder">New Order</button>':''}<button class="btn secondary" data-action="exportOrders">Export CSV</button></div></div><div class="searchbar"><input id="orderSearch" placeholder="Search customer or order"><select id="orderStatus"><option>All</option>${['New','Picking','Ready','Out for Service','Checked In','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderList">${orderList('','All')}</div></div>`;},
routes(){return `<div class="card"><div class="row wraprow"><div><h3>Delivery Routes</h3><div class="small muted">Build service routes and check in at each vending-machine location using the phone’s current GPS position.</div></div>${isManagement()?'<button class="btn" data-action="newRoute">Create Route</button>':''}</div>${(isDriver()?state.routes.filter(r=>!r.driver||r.driver===profile?.display_name||r.driver===profile?.email):state.routes).length?(isDriver()?state.routes.filter(r=>!r.driver||r.driver===profile?.display_name||r.driver===profile?.email):state.routes).map(r=>{const orders=r.orderIds.map(id=>state.orders.find(o=>o.id===id)).filter(Boolean);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.date)} • ${orders.length} stops • ${esc(r.driver||'Unassigned')}</div><span class="pill ${r.status==='Completed'?'good':'warn'}">${esc(r.status)}</span></div><div class="actions"><button class="btn smallbtn" data-action="openRoute" data-id="${r.id}">${isDriver()?'Start Route':'Open Route'}</button>${isManagement()?`<button class="btn secondary smallbtn" data-action="editRoute" data-id="${r.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteRoute" data-id="${r.id}">Delete</button>`:''}</div></div></div>`}).join(''):'<div class="empty">No routes created.</div>'}</div>`;},
sales(){const t=totals();return `<div class="grid4"><div class="stat"><span class="muted">Gross Sales</span><b>${money(t.sales)}</b></div><div class="stat"><span class="muted">Product Cost</span><b>${money(t.cogs)}</b></div><div class="stat"><span class="muted">Commission</span><b>${money(t.commission)}</b></div><div class="stat"><span class="muted">Net Profit</span><b class="good">${money(t.profit)}</b></div></div><div class="card" style="margin-top:12px"><div class="row wraprow"><div><h3>Sales Records</h3><div class="small muted">Track machine cash, card sales and profitability.</div></div><div class="actions"><button class="btn" data-action="addSale">Add Sale</button><button class="btn secondary" data-action="exportSales">Export CSV</button></div></div>${state.sales.length?state.sales.map(s=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(s.date)} • ${esc(s.location||s.machineName||'Sale')}</b><div class="small">Cash ${money(s.cash)} • Card ${money(s.card)} • Cost ${money(s.cost)} • Commission ${money(s.commission)}</div><div class="good">Profit ${money(Number(s.cash||0)+Number(s.card||0)-Number(s.cost||0)-Number(s.commission||0))}</div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editSale" data-id="${s.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteSale" data-id="${s.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No sales recorded.</div>'}</div>`;},
issues(){return `<div class="card"><div class="row wraprow"><div><h3>Returns, Damage, Expiration & Missing Stock</h3></div><button class="btn" data-action="addIssue">Record Issue</button></div>${state.issues.length?state.issues.map(i=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(i.type)} • ${esc(i.productName||'General')}</b><div class="small muted">Qty ${i.qty||0} • ${esc(i.location||'')} • ${esc(i.date||'')}</div><div>${esc(i.notes||'')}</div><span class="pill ${i.status==='Resolved'?'good':'warn'}">${esc(i.status)}</span></div><div class="actions"><button class="btn secondary smallbtn" data-action="editIssue" data-id="${i.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteIssue" data-id="${i.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No issues recorded.</div>'}</div>`;},
prospects(){const due=state.prospects.filter(p=>!p.archived&&p.followUp&&p.followUp<=new Date().toISOString().slice(0,10)&&!['Won','Not Interested','Closed'].includes(p.status)).length;return `<div class="card"><div class="row wraprow"><div><h3>Prospects</h3><div class="small muted">Track calls, follow-ups, next actions and conversions.</div></div><div class="actions"><span class="pill ${due?'bad':'good'}">${due} follow-up${due===1?'':'s'} due</span><button class="btn" data-action="addProspect">Add Prospect</button><button class="btn secondary" data-action="exportProspects">Export CSV</button></div></div><div class="searchbar"><input id="prospectSearch" placeholder="Search business, area, category or status"><select id="prospectFilter"><option value="active">Active leads</option><option value="followup">Follow-ups due</option><option value="all">All prospects</option><option value="archived">Archived / closed</option></select></div><div id="prospectList">${prospectList('','active')}</div></div>`;},
activity(){return `<div class="card"><div class="row"><div><h3>Activity History</h3><div class="small muted">Who changed what and when.</div></div><button class="btn secondary" data-action="exportActivity">Export CSV</button></div>${state.activity.length?state.activity.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div class="small muted">${esc(a.user)} • ${esc(a.role)} • ${new Date(a.at).toLocaleString()}</div></div><span class="small">${esc(a.entity||'')}</span></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`;},

function inventoryList(search,filter){let arr=state.products.filter(p=>{const s=(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(search.toLowerCase());const f=filter==='all'||(filter==='low'&&p.onHand<=p.reorder)||(filter==='inactive'&&p.active===false);return s&&f});return arr.length?arr.map(p=>`<div class="product">${productPhoto(p)}<div><b>${esc(p.name)}</b><div class="small muted">SKU ${esc(p.sku)} • UPC ${esc(p.barcode||'None')} • ${esc(p.category||'')}</div><div>On hand <b class="${p.onHand<=p.reorder?'bad':'good'}">${p.onHand}</b> • Reorder ${p.reorder}</div><div class="small">Cost ${money(p.cost)} • Price ${money(p.price)} • Unit profit <span class="good">${money(p.price-p.cost)}</span></div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editProduct" data-id="${p.id}">Edit</button><button class="btn smallbtn" data-action="adjustInventory" data-id="${p.id}">Adjust</button><button class="btn danger smallbtn" data-action="deleteProduct" data-id="${p.id}">Delete</button></div></div>`).join(''):'<div class="empty">No matching products.</div>'}
function orderList(search,status){let arr=state.orders.filter(o=>(o.customerName+' '+o.number).toLowerCase().includes(search.toLowerCase())&&(status==='All'||o.status===status));return arr.length?arr.map(o=>{const total=o.items.reduce((a,i)=>{const p=state.products.find(p=>p.id===i.productId);return a+Number(i.qty||0)*Number(p?.price||0)},0);const picked=o.items.reduce((a,i)=>a+Number(i.picked||0),0),needed=o.items.reduce((a,i)=>a+Number(i.qty||0),0);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(o.number)} • ${esc(o.customerName)}</b><div class="small muted">${esc(o.deliveryDate||'No date')} • ${esc(o.address||'')} • ${money(total)}</div><div class="small">Picked ${picked}/${needed} • Payment ${esc(o.paymentStatus||'Unpaid')}</div><span class="pill ${o.status==='Delivered'?'good':o.status==='Cancelled'?'bad':'warn'}">${esc(o.status)}</span></div><div class="actions">${canPickOrders()?`<button class="btn smallbtn" data-action="openOrder" data-id="${o.id}">${o.status==='Ready'?'Review':'Pick Order'}</button>`:''}${canCreateOrders()?`<button class="btn secondary smallbtn" data-action="editOrder" data-id="${o.id}">Edit</button>`:''}${isManagement()?`<button class="btn danger smallbtn" data-action="deleteOrder" data-id="${o.id}">Delete</button>`:''}</div></div></div>`}).join(''):'<div class="empty">No matching orders.</div>'}
function prospectList(search,filter='active'){const rank={Easy:1,Medium:2,Hard:3};const today=new Date().toISOString().slice(0,10);const arr=state.prospects.filter(p=>{const text=((p.business||'')+' '+(p.area||'')+' '+(p.address||'')+' '+(p.category||'')+' '+(p.priority||'')+' '+(p.status||'')+' '+(p.contact||'')+' '+(p.nextAction||'')+' '+(p.leadSource||'')).toLowerCase();const matches=text.includes((search||'').toLowerCase());const closed=['Won','Not Interested','Closed'].includes(p.status);const visible=filter==='all'||(filter==='archived'&&(p.archived||closed))||(filter==='followup'&&!p.archived&&p.followUp&&p.followUp<=today&&!closed)||(filter==='active'&&!p.archived&&!closed);return matches&&visible;}).sort((a,b)=>{const ad=a.followUp&&a.followUp<=today?0:1,bd=b.followUp&&b.followUp<=today?0:1;return ad-bd||(rank[a.priority]||2)-(rank[b.priority]||2)||String(a.business||'').localeCompare(String(b.business||''));});return arr.length?arr.map(p=>{const address=p.address||'';const map=address?'https://maps.apple.com/?q='+encodeURIComponent(address):'';const phone=String(p.phone||'').replace(/[^0-9+]/g,'');const source=(p.source||'').trim();const site=/^https?:\/\//i.test(source)?source:'';const due=p.followUp&&p.followUp<=today&&!['Won','Not Interested','Closed'].includes(p.status);const notes=Array.isArray(p.noteHistory)?p.noteHistory:[];return `<div class="subcard"><div class="row wraprow"><div style="min-width:0;flex:1"><div class="row wraprow" style="justify-content:flex-start"><b>${esc(p.business)}</b><span class="pill ${p.priority==='Easy'?'good':p.priority==='Hard'?'bad':'warn'}">${esc(p.priority||'Medium')}</span><span class="pill ${due?'bad':''}">${due?'Follow-up due':esc(p.status||'New')}</span>${p.archived?'<span class="pill">Archived</span>':''}</div><div class="small muted">${esc(p.category||'Independent business')} • ${esc(p.area||'')} • ${esc(p.contact||'No contact')}</div>${address?`<div style="margin-top:6px">📍 <a href="${map}" target="_blank" rel="noopener" style="color:var(--blue)">${esc(address)}</a></div>`:'<div class="small bad">Address not available</div>'}<div class="small" style="margin-top:6px"><b>Next action:</b> ${esc(p.nextAction||'Not set')}${p.followUp?' • '+esc(p.followUp):''}</div><div class="small muted"><b>Last contact:</b> ${esc(p.lastContact||'Not recorded')} • <b>Lead source:</b> ${esc(p.leadSource||'Not set')}</div>${p.notes?`<div style="margin-top:6px">${esc(p.notes)}</div>`:''}${notes.length?`<details style="margin-top:7px"><summary class="small blue">Notes history (${notes.length})</summary>${notes.slice().reverse().map(n=>`<div class="small subcard"><b>${new Date(n.at).toLocaleString()}</b><br>${esc(n.text)}</div>`).join('')}</details>`:''}</div><div class="actions"><button class="btn secondary smallbtn" data-action="editProspect" data-id="${esc(p.id)}">Edit</button>${phone?`<a class="btn good smallbtn" href="tel:${phone}">Call</a><a class="btn secondary smallbtn" href="sms:${phone}">Text</a>`:''}${address?`<a class="btn smallbtn" href="${map}" target="_blank" rel="noopener">Directions</a>`:''}${site?`<a class="btn secondary smallbtn" href="${esc(site)}" target="_blank" rel="noopener">Website</a>`:''}${p.status==='Won'?`<button class="btn good smallbtn" data-action="convertProspect" data-id="${esc(p.id)}">Create Machine</button>`:''}<button class="btn warn smallbtn" data-action="archiveProspect" data-id="${esc(p.id)}">${p.archived?'Unarchive':'Archive'}</button><button class="btn danger smallbtn" data-action="deleteProspect" data-id="${esc(p.id)}">Delete</button></div></div></div>`}).join(''):'<div class="empty">No prospects match this view.</div>'}
function field(label,id,value='',type='text',extra=''){return `<label class="label">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`}
function selectField(label,id,value,opts){return `<label class="label">${label}</label><select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`}

editStock(d){const m=state.machines.find(x=>x.id===d.id);const rows=state.products.filter(p=>p.active!==false).map(p=>{const s=state.machineStock.find(x=>x.machineId===m.id&&x.productId===p.id)||{qty:0,par:0,sold:0};return `<div class="product">${productPhoto(p)}<div><b>${esc(p.name)}</b><div class="grid3">${field('Stock','q_'+p.id,s.qty,'number','min="0" inputmode="numeric"')}${field('Par','par_'+p.id,s.par,'number','min="0" inputmode="numeric"')}${field('Sold','sold_'+p.id,s.sold,'number','min="0" inputmode="numeric"')}</div></div><button class="btn secondary smallbtn" data-stockscan="${p.id}">Scan +1</button></div>`}).join('');openModal('Edit Stock • '+m.name,`<div class="small muted">Type exact numbers for stock, par and sold. Scan adds one unit.</div>${rows}<button class="btn secondary" id="addFromStock" style="width:100%;margin-top:10px">Add New Product</button>`,()=>{state.products.filter(p=>p.active!==false).forEach(p=>{const qty=Math.max(0,Number(document.getElementById('q_'+p.id)?.value||0)),par=Math.max(0,Number(document.getElementById('par_'+p.id)?.value||0)),sold=Math.max(0,Number(document.getElementById('sold_'+p.id)?.value||0));let s=state.machineStock.find(x=>x.machineId===m.id&&x.productId===p.id);if(!s){s={id:uid(),machineId:m.id,productId:p.id,qty,par,sold};state.machineStock.push(s)}else Object.assign(s,{qty,par,sold});});persist('Updated machine stock for '+m.name,'machine',m.id);closeModal();render();});setTimeout(()=>{document.querySelectorAll('[data-stockscan]').forEach(b=>b.onclick=()=>startScanner(code=>{const p=state.products.find(p=>p.barcode===code);if(!p)return toast('Barcode not found.');const el=document.getElementById('q_'+p.id);if(el)el.value=Number(el.value||0)+1;else toast('Product is inactive or not visible.');}));document.getElementById('addFromStock').onclick=()=>{closeModal();actions.addProduct();};},0);},
addProduct(){productForm();},editProduct(d){productForm(state.products.find(x=>x.id===d.id));},adjustInventory(d){const p=state.products.find(x=>x.id===d.id);openModal('Adjust Inventory • '+p.name,`${field('Exact on-hand quantity','adjQty',p.onHand,'number','min="0" inputmode="numeric"')}<label class="label">Reason</label><select id="adjReason"><option>Count correction</option><option>Purchase received</option><option>Damage</option><option>Expiration</option><option>Missing</option><option>Return</option></select>`,()=>{const old=p.onHand;p.onHand=Math.max(0,Number(document.getElementById('adjQty').value||0));persist(`Adjusted ${p.name} from ${old} to ${p.onHand}`,'product',p.id);closeModal();render();});},deleteProduct(d){const p=state.products.find(x=>x.id===d.id);if(p&&confirmDelete(p.name)){state.products=state.products.filter(x=>x.id!==d.id);state.machineStock=state.machineStock.filter(x=>x.productId!==d.id);persist('Deleted product '+p.name,'product',d.id);render();}},
newOrder(){if(!canCreateOrders())return toast('Only sales or management can create orders.');orderForm();},editOrder(d){if(!canCreateOrders())return toast('Warehouse only picks orders.');orderForm(state.orders.find(x=>x.id===d.id));},deleteOrder(d){if(!isManagement())return toast('Only management can delete orders.');const o=state.orders.find(x=>x.id===d.id);if(o&&confirmDelete(o.number)){state.orders=state.orders.filter(x=>x.id!==d.id);state.routes.forEach(r=>r.orderIds=r.orderIds.filter(id=>id!==d.id));persist('Deleted order '+o.number,'order',d.id);render();}},openOrder(d){if(!canPickOrders())return toast('Drivers do not pick orders.');openOrderView(state.orders.find(x=>x.id===d.id));},

addSale(){saleForm();},editSale(d){saleForm(state.sales.find(x=>x.id===d.id));},deleteSale(d){const s=state.sales.find(x=>x.id===d.id);if(s&&confirmDelete('sale record')){state.sales=state.sales.filter(x=>x.id!==d.id);persist('Deleted sale record','sale',d.id);render();}},
addIssue(){issueForm();},editIssue(d){issueForm(state.issues.find(x=>x.id===d.id));},deleteIssue(d){const i=state.issues.find(x=>x.id===d.id);if(i&&confirmDelete('issue')){state.issues=state.issues.filter(x=>x.id!==d.id);persist('Deleted issue','issue',d.id);render();}},
addProspect(){prospectForm();},editProspect(d){const p=state.prospects.find(x=>String(x.id)===String(d.id));if(!p)return toast('Prospect not found. Tap Sync and try again.');prospectForm(p);},archiveProspect(d){const p=state.prospects.find(x=>String(x.id)===String(d.id));if(!p)return;p.archived=!p.archived;persist((p.archived?'Archived ':'Unarchived ')+p.business,'prospect',p.id);render();syncCloud(false);},convertProspect(d){const p=state.prospects.find(x=>String(x.id)===String(d.id));if(!p)return;if(state.machines.some(m=>m.prospectId===p.id))return toast('This prospect already has a machine.');const m={id:uid(),prospectId:p.id,name:p.business,location:p.business,address:p.address||'',status:'Prospect',type:'Combo',serial:'',reader:'',serviceDay:'',notes:'Converted from prospect. '+(p.notes||'')};state.machines.push(m);p.convertedMachineId=m.id;p.archived=true;persist('Converted won prospect '+p.business+' into a machine','machine',m.id);render();syncCloud(false);toast('Machine location created.');},deleteProspect(d){const p=state.prospects.find(x=>String(x.id)===String(d.id));if(p&&confirmDelete(p.business)){state.prospects=state.prospects.filter(x=>String(x.id)!==String(d.id));persist('Deleted prospect '+p.business,'prospect',d.id);render();syncCloud(false);}},
exportProspects(){downloadCSV('prospects.csv',state.prospects.map(p=>({Business:p.business,Category:p.category,Contact:p.contact,Phone:p.phone,Area:p.area,Address:p.address,Difficulty:p.priority,Status:p.status,LastContact:p.lastContact,FollowUp:p.followUp,NextAction:p.nextAction,LeadSource:p.leadSource,Website:p.source,Archived:!!p.archived,Notes:p.notes})));},exportInventory(){downloadCSV('inventory.csv',state.products.map(p=>({SKU:p.sku,Barcode:p.barcode,Product:p.name,Category:p.category,Cost:p.cost,Price:p.price,OnHand:p.onHand,Reorder:p.reorder,Supplier:p.supplier})));},exportOrders(){downloadCSV('orders.csv',state.orders.map(o=>({Order:o.number,Customer:o.customerName,Phone:o.phone,Address:o.address,DeliveryDate:o.deliveryDate,Status:o.status,Payment:o.paymentStatus,Items:o.items.reduce((a,i)=>a+i.qty,0)})));},exportSales(){downloadCSV('sales.csv',state.sales);},exportActivity(){downloadCSV('activity.csv',state.activity);},manualSync(){syncCloud(true);},makeBackup(){makeSnapshot();toast('Backup snapshot created.');render();},exportBackup(){downloadFile('str8-vending-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');},installApp(){installPwa();},resetDemo(){if(confirm('Reset this device to clean demo data?')){state=starter();localStorage.setItem(LS,JSON.stringify(state));logActivity('Reset demo data');render();}},restoreSnapshot(d){const b=getBackups()[Number(d.index)];if(b&&confirm('Restore this snapshot?')){state=b.data;persist('Restored local snapshot','backup','');render();}}

function machineForm(m={}){openModal(m.id?'Edit Machine':'Add Machine',`<div class="grid2">${field('Machine name','mName',m.name||'')}${selectField('Status','mStatus',m.status||'Active',['Active','Prospect','Service Needed','Inactive'])}${field('Location','mLocation',m.location||'')}${field('Address','mAddress',m.address||'')}${field('Machine type','mType',m.type||'Combo')}${field('Serial number','mSerial',m.serial||'')}${field('Card reader ID','mReader',m.reader||'')}${field('Service day','mDay',m.serviceDay||'')}</div><label class="label">Notes</label><textarea id="mNotes">${esc(m.notes||'')}</textarea>`,()=>{const x=m.id?m:{id:uid()};Object.assign(x,{name:val('mName'),status:val('mStatus'),location:val('mLocation'),address:val('mAddress'),type:val('mType'),serial:val('mSerial'),reader:val('mReader'),serviceDay:val('mDay'),notes:val('mNotes')});if(!m.id)state.machines.push(x);persist((m.id?'Updated':'Added')+' machine '+x.name,'machine',x.id);closeModal();render();});}

function receiveInventoryFlow(startMode='scan'){
  let selected=null;
  const showReceive=(barcode='')=>{
    selected=state.products.find(p=>String(p.barcode||'').trim()===String(barcode||'').trim())||null;
    if(!selected){
      openModal('Product Not Found',`${field('Barcode / UPC','receiveUnknownBarcode',barcode,'text','inputmode="numeric"')}<div class="subcard"><b>No matching product</b><div class="small muted">Add this product first, then scan it again to receive inventory.</div></div>`,()=>{closeModal();productForm({barcode:val('receiveUnknownBarcode')});},'Add Product');
      return;
    }
    openModal('Receive Shipment',`${productPhoto(selected)}<div style="margin-top:10px"><h3>${esc(selected.name)}</h3><div class="small muted">SKU ${esc(selected.sku||'')} • UPC ${esc(selected.barcode||'')}</div><div style="margin-top:6px">Current warehouse quantity: <b>${Number(selected.onHand||0)}</b></div></div>${field('Quantity received','receiveQty',1,'number','min="1" inputmode="numeric"')}${field('Supplier / source','receiveSupplier',selected.supplier||'')}<label class="label">Receiving note</label><textarea id="receiveNote" placeholder="Invoice, delivery, damage, or other note"></textarea>`,()=>{
      const qty=Math.max(0,intv('receiveQty'));
      if(!qty){toast('Enter the quantity received.');return;}
      selected.onHand=Number(selected.onHand||0)+qty;
      const supplier=val('receiveSupplier').trim();if(supplier)selected.supplier=supplier;
      state.inventoryHistory=state.inventoryHistory||[];
      state.inventoryHistory.unshift({id:uid(),at:new Date().toISOString(),productId:selected.id,productName:selected.name,change:qty,reason:'Shipment received'+(val('receiveNote').trim()?' - '+val('receiveNote').trim():'')});
      persist('Received '+qty+' '+selected.name,'inventory',selected.id);
      closeModal();render();syncCloud(false);toast(qty+' added to '+selected.name+'.');
    },'Add to Warehouse');
  };
  if(startMode==='manual'){
    openModal('Manual Barcode Entry',`${field('Barcode / UPC','manualReceiveCode','','text','inputmode="numeric" autofocus')}<div class="small muted">Type the barcode printed on the product.</div>`,()=>{const code=val('manualReceiveCode').trim();if(!code){toast('Enter a barcode.');return;}closeModal();showReceive(code);},'Find Product');
  }else{
    startScanner(showReceive);
  }
}

async function syncCloud(show=true){
  if(!navigator.onLine){if(show)toast('Offline. Changes are saved locally.');return;}
  try{
    makeSnapshot();
    const headers={
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      'Accept':'application/json'
    };
    const url=SUPABASE_URL+'/rest/v1/stb_one_state?id=eq.main&select=data,version,updated_at';
    const response=await fetch(url,{headers,cache:'no-store'});
    if(!response.ok)throw new Error('Cloud read failed ('+response.status+')');
    const rows=await response.json();
    if(!Array.isArray(rows)||!rows.length)throw new Error('Cloud record was not found');
    const row=rows[0];
    const remote=(row&&row.data&&typeof row.data==='object')?row.data:{};
    const remoteProspects=Array.isArray(remote.prospects)?remote.prospects:[];
    const localProspects=Array.isArray(state.prospects)?state.prospects:[];

    // Never allow an empty phone copy to erase a populated cloud prospect list.
    if(localProspects.length===0&&remoteProspects.length>0){
      state=Object.assign(starter(),remote,state,{prospects:remoteProspects});
      state.pendingSync=false;
      state.updatedAt=remote.updatedAt||row.updated_at||new Date().toISOString();
    }else if(!state.pendingSync){
      state=Object.assign(starter(),remote);
      state.pendingSync=false;
    }else{
      const safeState=Object.assign({},state);
      if((!Array.isArray(safeState.prospects)||safeState.prospects.length===0)&&remoteProspects.length>0){
        safeState.prospects=remoteProspects;
      }
      const patch=await fetch(SUPABASE_URL+'/rest/v1/stb_one_state?id=eq.main',{
        method:'PATCH',headers:Object.assign({},headers,{'Prefer':'return=minimal'}),
        body:JSON.stringify({data:safeState,version:Number(row.version||0)+1,updated_at:new Date().toISOString()})
      });
      if(!patch.ok)throw new Error('Cloud save failed ('+patch.status+')');
      state=safeState;
      state.pendingSync=false;
    }
    state.lastSync=new Date().toISOString();
    localStorage.setItem(LS,JSON.stringify(state));
    renderNetwork();render();
    if(show)toast('Cloud sync complete. '+(state.prospects?.length||0)+' prospects loaded.');
  }catch(e){
    console.error('STR8 cloud sync error',e);
    renderNetwork();
    if(show)toast('Cloud sync failed: '+(e.message||'Unknown error'));
  }
}

async function init(){if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=5').catch(()=>{});}document.getElementById('loginScreen').classList.add('hidden');demo=false;user={email:'owner@stbdistribution.com'};profile={email:'owner@stbdistribution.com',display_name:'STB Owner',role:'owner'};showApp();await syncCloud(false);render();}
/* STR8 Enterprise Operations Pack */
function ensureEnterpriseState(){
  const defaults={serviceRecords:[],purchaseOrders:[],employees:[
    {id:'emp-owner',name:'STB Owner',role:'owner',active:true},
    {id:'emp-warehouse',name:'Warehouse Team',role:'warehouse',active:true},
    {id:'emp-route',name:'Route Driver',role:'route',active:true},
    {id:'emp-sales',name:'Sales Team',role:'sales',active:true}
  ],inventoryHistory:[],cashCollections:[],cloudVersion:Number(state.cloudVersion||0),lastAutoBackup:null,syncConflict:null};
  Object.keys(defaults).forEach(k=>{if(state[k]===undefined)state[k]=defaults[k]});
  state.machines=(state.machines||[]).map(m=>Object.assign({photo:'',serialNumber:'',cardReaderId:'',purchasePrice:0,financeBalance:0,commissionPercent:0,monthlyGoal:0,lastService:'',nextService:'',slotLayout:'',notes:''},m));
  state.products=(state.products||[]).map(p=>Object.assign({expirationDate:'',supplier:'',reorderQty:0},p));
  state.routes=(state.routes||[]).map(r=>Object.assign({startMileage:'',endMileage:'',startedAt:'',completedAt:'',driver:''},r));
}
ensureEnterpriseState();
['service','purchases','reports','staff'].forEach(p=>{if(!roles.owner.includes(p))roles.owner.push(p)});
['service','purchases','reports','staff'].forEach(p=>{if(!roles.manager.includes(p))roles.manager.push(p)});
if(!roles.warehouse.includes('purchases'))roles.warehouse.push('purchases');
if(!roles.route.includes('service'))roles.route.push('service');
Object.assign(labels,{service:'Service',purchases:'Purchasing',reports:'Reports',staff:'Staff'});

function dateOnly(v){return v?new Date(v+'T12:00:00').toLocaleDateString():''}
function machineById(id){return state.machines.find(m=>String(m.id)===String(id))}
function productById(id){return state.products.find(p=>String(p.id)===String(id))}
function readyOrders(){return state.orders.filter(o=>o.status==='Ready')}
function allPickNeeds(){const map={};state.orders.filter(o=>['New','Picking'].includes(o.status)).forEach(o=>(o.items||[]).forEach(i=>{const left=Math.max(0,Number(i.qty||0)-Number(i.picked||0));if(!left)return;map[i.productId]=(map[i.productId]||0)+left;}));return map;}
function expectedCash(machineId){return state.sales.filter(s=>String(s.machineId)===String(machineId)).reduce((a,s)=>a+Number(s.cash||0),0)}

pages.dashboard=function(){ensureEnterpriseState();const t=totals(),low=state.products.filter(p=>p.active!==false&&Number(p.onHand)<=Number(p.reorder)),open=state.orders.filter(o=>!['Checked In','Cancelled'].includes(o.status)),activeRoutes=state.routes.filter(r=>r.status!=='Completed'),due=state.machines.filter(m=>m.nextService&&m.nextService<=new Date().toISOString().slice(0,10));return `<div class="grid4"><div class="stat"><span class="muted">Machines</span><b>${state.machines.length}</b></div><div class="stat"><span class="muted">Low Stock</span><b class="${low.length?'bad':'good'}">${low.length}</b></div><div class="stat"><span class="muted">Orders Waiting</span><b>${open.length}</b></div><div class="stat"><span class="muted">Net Profit</span><b class="good">${money(t.profit)}</b></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Needs Attention</h3>${low.slice(0,8).map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="bad">${p.onHand} left</b></div>`).join('')||'<div class="muted">No low stock.</div>'}${due.slice(0,8).map(m=>`<div class="row"><span>${esc(m.name)} service due</span><b class="bad">${dateOnly(m.nextService)}</b></div>`).join('')}</div><div class="card"><h3>Operations</h3><div class="row"><span>Ready for routes</span><b>${readyOrders().length}</b></div><div class="row"><span>Active routes</span><b>${activeRoutes.length}</b></div><div class="row"><span>Open issues</span><b>${state.issues.filter(i=>i.status!=='Resolved').length}</b></div><div class="row"><span>Last synced</span><b>${state.lastSync?new Date(state.lastSync).toLocaleString():'Never'}</b></div>${state.syncConflict?'<div class="bad small">Sync conflict needs review in Settings.</div>':''}</div></div>`};

pages.orders=function(){const needs=allPickNeeds();const rows=Object.entries(needs).map(([id,qty])=>{const p=productById(id);return p?`<div class="row"><span>${esc(p.name)} <span class="small muted">${esc(p.sku)}</span></span><b class="${p.onHand<qty?'bad':'good'}">${qty} needed / ${p.onHand} on hand</b></div>`:''}).join('');return `<div class="card"><div class="row wraprow"><div><h3>${isWarehouse()?'Warehouse Picking':'Orders'}</h3><div class="small muted">${isWarehouse()?'Pick and scan every item, then mark the order Ready for the driver.':'Create orders and send them to warehouse picking.'}</div></div><div class="actions">${canCreateOrders()?'<button class="btn" data-action="newOrder">New Order</button>':''}<button class="btn secondary" data-action="masterPickList">Master Pick List</button><button class="btn secondary" data-action="exportOrders">Export CSV</button></div></div>${rows?`<div class="subcard"><h3>Combined Items Needed</h3>${rows}</div>`:''}<div class="searchbar"><input id="orderSearch" placeholder="Search customer or order"><select id="orderStatus"><option>All</option>${['New','Picking','Ready','Out for Service','Checked In','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderList">${orderList('','All')}</div></div>`};

pages.machines=function(){ensureEnterpriseState();return `<div class="card"><div class="row wraprow"><div><h3>Machines</h3><div class="small muted">Full machine profile, stock, service, sales and cash control.</div></div>${isManagement()?'<button class="btn" data-action="addMachine">Add Machine</button>':''}</div>${state.machines.length?state.machines.map(m=>{const stock=state.machineStock.filter(x=>String(x.machineId)===String(m.id));const stockValue=stock.reduce((a,x)=>a+Number(x.qty||0)*Number(productById(x.productId)?.price||0),0);const monthSales=state.sales.filter(s=>String(s.machineId)===String(m.id)&&String(s.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).reduce((a,s)=>a+Number(s.cash||0)+Number(s.card||0),0);return `<div class="subcard"><div class="product">${m.photo?`<img class="photo" src="${m.photo}">`:'<div class="photo placeholder">🏧</div>'}<div><b>${esc(m.name)}</b><div class="small muted">${esc(m.location||'No location')} • ${esc(m.address||'')}</div><div class="small">Serial ${esc(m.serialNumber||'—')} • Reader ${esc(m.cardReaderId||'—')}</div><div>Stock value ${money(stockValue)} • Month ${money(monthSales)} / Goal ${money(m.monthlyGoal)}</div><div class="small">Commission ${Number(m.commissionPercent||0)}% • Next service ${dateOnly(m.nextService)||'Not set'}</div></div><div class="actions">${isManagement()?`<button class="btn secondary smallbtn" data-action="editMachinePlus" data-id="${m.id}">Edit</button>`:''}<button class="btn smallbtn" data-action="editStock" data-id="${m.id}">Stock</button><button class="btn secondary smallbtn" data-action="serviceMachine" data-id="${m.id}">Service</button><button class="btn secondary smallbtn" data-action="collectCash" data-id="${m.id}">Cash</button>${isManagement()?`<button class="btn danger smallbtn" data-action="deleteMachine" data-id="${m.id}">Delete</button>`:''}</div></div></div>`}).join(''):'<div class="empty">No machines yet.</div>'}</div>`};

pages.service=function(){const records=[...state.serviceRecords].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<div class="card"><div class="row wraprow"><div><h3>Machine Service History</h3><div class="small muted">Cleaning, refills, repairs, card-reader checks and next service dates.</div></div><button class="btn" data-action="newService">New Service Record</button></div>${records.length?records.map(r=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(r.machineName)} • ${dateOnly(r.date)}</b><div class="small">Refilled ${r.refilled?'✓':'—'} • Cleaned ${r.cleaned?'✓':'—'} • Tested ${r.tested?'✓':'—'} • Expired removed ${r.expiredRemoved?'✓':'—'}</div><div>${esc(r.issues||'No issues')}</div><div class="small muted">Completed by ${esc(r.completedBy||'')} • Next ${dateOnly(r.nextService)||'Not set'}</div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editService" data-id="${r.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteService" data-id="${r.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No service records.</div>'}</div>`};

pages.purchases=function(){const po=state.purchaseOrders||[];return `<div class="card"><div class="row wraprow"><div><h3>Purchasing & Receipts</h3><div class="small muted">Supplier orders, received quantities and inventory cost.</div></div><button class="btn" data-action="newPurchase">New Purchase Order</button></div>${po.length?po.map(x=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(x.number)} • ${esc(x.supplier)}</b><div class="small muted">${dateOnly(x.date)} • ${esc(x.status)} • ${money(x.total)}</div><div>${(x.items||[]).map(i=>`${esc(productById(i.productId)?.name||'Product')} × ${i.qty}`).join(', ')}</div></div><div class="actions">${x.status!=='Received'?`<button class="btn good smallbtn" data-action="receivePurchase" data-id="${x.id}">Receive</button>`:''}<button class="btn secondary smallbtn" data-action="editPurchase" data-id="${x.id}">Edit</button><button class="btn danger smallbtn" data-action="deletePurchase" data-id="${x.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No purchase orders.</div>'}</div>`};

pages.reports=function(){const t=totals();const mileage=state.routes.reduce((a,r)=>a+Math.max(0,Number(r.endMileage||0)-Number(r.startMileage||0)),0);const missing=state.issues.filter(i=>['Missing','Theft','Damaged','Expired'].includes(i.type)).reduce((a,i)=>a+Number(i.qty||0),0);const byMachine=state.machines.map(m=>{const ss=state.sales.filter(s=>String(s.machineId)===String(m.id));const gross=ss.reduce((a,s)=>a+Number(s.cash||0)+Number(s.card||0),0),cost=ss.reduce((a,s)=>a+Number(s.cost||0)+Number(s.commission||0),0);return {m,gross,profit:gross-cost}}).sort((a,b)=>b.gross-a.gross);return `<div class="grid4"><div class="stat"><span>Gross Sales</span><b>${money(t.sales)}</b></div><div class="stat"><span>Net Profit</span><b>${money(t.profit)}</b></div><div class="stat"><span>Route Mileage</span><b>${mileage.toFixed(1)}</b></div><div class="stat"><span>Loss Units</span><b>${missing}</b></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Machine Performance</h3>${byMachine.map(x=>`<div class="row"><span>${esc(x.m.name)}</span><span>${money(x.gross)} / <b class="good">${money(x.profit)}</b></span></div>`).join('')||'<div class="muted">No machine sales.</div>'}</div><div class="card"><h3>Exports</h3><button class="btn secondary" style="width:100%" data-action="exportMachineReport">Machine Report CSV</button><button class="btn secondary" style="width:100%;margin-top:8px" data-action="exportServiceReport">Service Report CSV</button><button class="btn secondary" style="width:100%;margin-top:8px" data-action="exportLossReport">Loss Report CSV</button></div></div>`};

const employeeTeams=[{value:'owner',label:'Owner'},{value:'manager',label:'Management'},{value:'warehouse',label:'Warehouse'},{value:'route',label:'Drivers'},{value:'sales',label:'Sales'}];
function employeeTeamLabel(roleValue){return employeeTeams.find(t=>t.value===roleValue)?.label||'Unassigned'}
pages.staff=function(){const groups=employeeTeams.map(t=>{const workers=(state.employees||[]).filter(e=>e.role===t.value);return `<div class="subcard"><div class="row wraprow"><div><h4 style="margin:0">${t.label}</h4><div class="small muted">${workers.length} team member${workers.length===1?'':'s'}</div></div></div>${workers.length?workers.map(e=>`<div class="row wraprow" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><div><b>${esc(e.name)}</b><div class="small muted">${e.active?'Active':'Inactive'} • ${t.label}</div></div><div class="actions"><button class="btn smallbtn" data-action="switchRole" data-id="${e.id}" ${e.active?'':'disabled'}>Use This Role</button><button class="btn secondary smallbtn" data-action="editEmployee" data-id="${e.id}">Edit</button></div></div>`).join(''):'<div class="empty">No employees assigned to this team.</div>'}</div>`}).join('');return `<div class="card"><div class="row wraprow"><div><h3>Staff & Teams</h3><div class="small muted">Every employee must be assigned to Owner, Management, Warehouse, Drivers, or Sales.</div></div><button class="btn" data-action="addEmployee">Add Employee</button></div>${groups}</div>`};

const oldSettingsPage=pages.settings;
pages.settings=function(){const base=oldSettingsPage();return base+`<div class="card"><h3>Cloud Protection</h3><div class="row"><span>Cloud version</span><b>${state.cloudVersion||0}</b></div><div class="row"><span>Last automatic backup</span><b>${state.lastAutoBackup?new Date(state.lastAutoBackup).toLocaleString():'Never'}</b></div>${state.syncConflict?`<div class="subcard"><b class="bad">Sync conflict detected</b><div class="small">Cloud version ${state.syncConflict.remoteVersion}; this phone version ${state.cloudVersion||0}.</div><div class="actions"><button class="btn" data-action="useCloudCopy">Use Cloud Copy</button><button class="btn warn" data-action="keepPhoneCopy">Keep Phone Copy</button></div></div>`:''}<button class="btn secondary" style="width:100%;margin-top:8px" data-action="cloudBackup">Create Cloud Backup</button><button class="btn secondary" style="width:100%;margin-top:8px" data-action="restoreCloudBackup">Restore Latest Cloud Backup</button></div>`};

function masterPickListView(){const needs=allPickNeeds();const rows=Object.entries(needs);openModal('Master Warehouse Pick List',rows.length?rows.map(([id,qty])=>{const p=productById(id);return `<div class="product">${productPhoto(p||{})}<div><b>${esc(p?.name||'Missing')}</b><div class="small muted">SKU ${esc(p?.sku||'')} • Barcode ${esc(p?.barcode||'')}</div><div>Pick <b>${qty}</b> • Warehouse <b class="${Number(p?.onHand||0)<qty?'bad':'good'}">${p?.onHand||0}</b></div></div><button class="btn smallbtn" type="button" data-master-scan="${id}">Scan</button></div>`}).join(''):'<div class="empty">Nothing waiting to be picked.</div>',()=>closeModal(),'Close');setTimeout(()=>document.querySelectorAll('[data-master-scan]').forEach(b=>b.onclick=()=>startScanner(code=>{const p=productById(b.dataset.masterScan);if(!p||p.barcode!==code)return toast('Wrong product scanned.');toast(p.name+' confirmed.');})),0)}

function machinePlusForm(m){m=m||{id:uid(),name:'',status:'Active'};openModal(m.name?'Edit Machine':'Add Machine',`<div class="grid2">${field('Machine name','mpName',m.name||'')}${field('Location','mpLocation',m.location||'')}${field('Address','mpAddress',m.address||'')}${field('Serial number','mpSerial',m.serialNumber||'')}${field('Card reader ID','mpReader',m.cardReaderId||'')}${field('Purchase price','mpPurchase',m.purchasePrice||0,'number','step="0.01"')}${field('Finance balance','mpFinance',m.financeBalance||0,'number','step="0.01"')}${field('Commission %','mpCommission',m.commissionPercent||0,'number','step="0.01"')}${field('Monthly sales goal','mpGoal',m.monthlyGoal||0,'number','step="0.01"')}${field('Last service','mpLast',m.lastService||'','date')}${field('Next service','mpNext',m.nextService||'','date')}</div><label class="label">Machine photo</label><input id="mpPhoto" type="file" accept="image/*"><label class="label">Slot layout</label><textarea id="mpSlots">${esc(m.slotLayout||'')}</textarea><label class="label">Notes</label><textarea id="mpNotes">${esc(m.notes||'')}</textarea>`,async()=>{const isNew=!state.machines.some(x=>String(x.id)===String(m.id));const f=document.getElementById('mpPhoto').files[0];if(f)m.photo=await compressImage(f);Object.assign(m,{name:val('mpName'),location:val('mpLocation'),address:val('mpAddress'),serialNumber:val('mpSerial'),cardReaderId:val('mpReader'),purchasePrice:num('mpPurchase'),financeBalance:num('mpFinance'),commissionPercent:num('mpCommission'),monthlyGoal:num('mpGoal'),lastService:val('mpLast'),nextService:val('mpNext'),slotLayout:val('mpSlots'),notes:val('mpNotes'),status:m.status||'Active'});if(isNew)state.machines.push(m);persist((isNew?'Added':'Updated')+' machine '+m.name,'machine',m.id);closeModal();render();syncCloud(false);});}

function serviceForm(r,machineId){r=r||{id:uid(),machineId:machineId||'',date:new Date().toISOString().slice(0,10),refilled:false,cleaned:false,tested:false,expiredRemoved:false};openModal(r.machineName?'Edit Service':'New Service',`<div class="grid2"><label class="label">Machine</label><select id="svMachine">${state.machines.map(m=>`<option value="${m.id}" ${String(m.id)===String(r.machineId)?'selected':''}>${esc(m.name)}</option>`).join('')}</select>${field('Date','svDate',r.date||'','date')}${field('Completed by','svBy',r.completedBy||profile?.display_name||'')}${field('Next service','svNext',r.nextService||'','date')}</div><div class="grid2"><label class="checkline"><input type="checkbox" id="svRefill" ${r.refilled?'checked':''}> Refilled</label><label class="checkline"><input type="checkbox" id="svClean" ${r.cleaned?'checked':''}> Cleaned</label><label class="checkline"><input type="checkbox" id="svTest" ${r.tested?'checked':''}> Machine tested</label><label class="checkline"><input type="checkbox" id="svExpired" ${r.expiredRemoved?'checked':''}> Expired removed</label></div><label class="label">Issues / repairs</label><textarea id="svIssues">${esc(r.issues||'')}</textarea>`,()=>{const isNew=!state.serviceRecords.some(x=>x.id===r.id),m=machineById(val('svMachine'));Object.assign(r,{machineId:m?.id||'',machineName:m?.name||'',date:val('svDate'),completedBy:val('svBy'),nextService:val('svNext'),refilled:document.getElementById('svRefill').checked,cleaned:document.getElementById('svClean').checked,tested:document.getElementById('svTest').checked,expiredRemoved:document.getElementById('svExpired').checked,issues:val('svIssues')});if(isNew)state.serviceRecords.push(r);if(m){m.lastService=r.date;m.nextService=r.nextService;}persist((isNew?'Added':'Updated')+' service for '+r.machineName,'service',r.id);closeModal();render();syncCloud(false);});}

function purchaseForm(x){x=x||{id:uid(),number:'PO-'+String(Date.now()).slice(-6),date:new Date().toISOString().slice(0,10),status:'Ordered',items:[]};openModal(x.supplier?'Edit Purchase Order':'New Purchase Order',`${field('PO number','poNumber',x.number)}${field('Supplier','poSupplier',x.supplier||'')}${field('Date','poDate',x.date,'date')}<label class="label">Status</label><select id="poStatus">${['Draft','Ordered','Received','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><h3 style="margin-top:14px">Items</h3>${state.products.map(p=>{const it=x.items.find(i=>String(i.productId)===String(p.id))||{};return `<div class="grid3"><div>${esc(p.name)}</div><input id="poq_${p.id}" type="number" min="0" value="${it.qty||0}" placeholder="Qty"><input id="poc_${p.id}" type="number" min="0" step="0.01" value="${it.unitCost??p.cost??0}" placeholder="Unit cost"></div>`}).join('')}`,()=>{const isNew=!state.purchaseOrders.some(p=>p.id===x.id);x.number=val('poNumber');x.supplier=val('poSupplier');x.date=val('poDate');x.status=val('poStatus');x.items=state.products.map(p=>({productId:p.id,qty:intv('poq_'+p.id),unitCost:num('poc_'+p.id)})).filter(i=>i.qty>0);x.total=x.items.reduce((a,i)=>a+i.qty*i.unitCost,0);if(isNew)state.purchaseOrders.push(x);persist((isNew?'Created':'Updated')+' '+x.number,'purchase',x.id);closeModal();render();syncCloud(false);});}

function employeeForm(e){e=e||{id:uid(),active:true,role:'warehouse'};openModal(e.name?'Edit Employee':'Add Employee',`${field('Employee Name','emName',e.name||'')}<label class="label">Team</label><select id="emRole" required><option value="">Choose a team</option>${employeeTeams.map(t=>`<option value="${t.value}" ${t.value===e.role?'selected':''}>${t.label}</option>`).join('')}</select><div class="small muted" style="margin-top:6px">The selected team controls what this employee can see and do.</div><label class="checkline"><input id="emActive" type="checkbox" ${e.active!==false?'checked':''}> Active employee</label>`,()=>{const name=val('emName').trim(),team=val('emRole');if(!name){toast('Enter the employee name.');return}if(!team){toast('Choose a team.');return}const isNew=!state.employees.some(x=>x.id===e.id);Object.assign(e,{name,role:team,team:employeeTeamLabel(team),active:document.getElementById('emActive').checked});if(isNew)state.employees.push(e);persist((isNew?'Added ':'Updated ')+e.name+' under the '+employeeTeamLabel(team)+' team','employee',e.id);closeModal();render();syncCloud(false);});}

async function createCloudBackup(reason='manual'){ensureEnterpriseState();const res=await fetch(SUPABASE_URL+'/rest/v1/stb_state_backups',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({reason,version:Number(state.cloudVersion||0),data:state})});if(!res.ok)throw new Error('Backup failed ('+res.status+')');state.lastAutoBackup=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(state));}
async function autoBackup(){const day=24*60*60*1000;if(!state.lastAutoBackup||Date.now()-new Date(state.lastAutoBackup).getTime()>day){try{await createCloudBackup('automatic daily')}catch(e){console.error(e)}}}

const originalSyncCloud=syncCloud;
syncCloud=async function(show=true,force=''){if(!navigator.onLine){if(show)toast('Offline. Changes saved locally.');return;}try{ensureEnterpriseState();const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Accept:'application/json'};const r=await fetch(SUPABASE_URL+'/rest/v1/stb_one_state?id=eq.main&select=data,version,updated_at',{headers:h,cache:'no-store'});if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');const rows=await r.json(),row=rows[0],remote=Object.assign({},row?.data||{}),rv=Number(row?.version||0),lv=Number(state.cloudVersion||0);if(state.pendingSync&&rv>lv&&force!=='phone'){state.syncConflict={remoteVersion:rv,remoteData:remote};localStorage.setItem(LS,JSON.stringify(state));render();if(show)toast('Sync paused: newer cloud changes found.');return;}if(force==='cloud'||!state.pendingSync){state=Object.assign(starter(),remote,{cloudVersion:rv,pendingSync:false,lastSync:new Date().toISOString(),syncConflict:null});ensureEnterpriseState();}else{await createCloudBackup('before sync save');const safe=JSON.parse(JSON.stringify(state));delete safe.syncConflict;const p=await fetch(SUPABASE_URL+'/rest/v1/stb_one_state?id=eq.main',{method:'PATCH',headers:Object.assign({},h,{Prefer:'return=minimal'}),body:JSON.stringify({data:safe,version:rv+1,updated_at:new Date().toISOString()})});if(!p.ok)throw new Error('Cloud save failed ('+p.status+')');state.cloudVersion=rv+1;state.pendingSync=false;state.lastSync=new Date().toISOString();state.syncConflict=null;}localStorage.setItem(LS,JSON.stringify(state));renderNetwork();render();if(show)toast('Cloud sync complete.');}catch(e){console.error(e);if(show)toast('Cloud sync failed: '+e.message)}};

 collectCash(d){const m=machineById(d.id);openModal('Cash Collection - '+m.name,`${field('Date','ccDate',new Date().toISOString().slice(0,10),'date')}${field('Cash expected','ccExpected',expectedCash(m.id),'number','step="0.01"')}${field('Cash collected','ccCollected','','number','step="0.01"')}${field('Collected by','ccBy',profile?.display_name||'')}<label class="label">Notes</label><textarea id="ccNotes"></textarea>`,()=>{const x={id:uid(),machineId:m.id,machineName:m.name,date:val('ccDate'),expected:num('ccExpected'),collected:num('ccCollected'),collectedBy:val('ccBy'),notes:val('ccNotes')};state.cashCollections.push(x);persist('Recorded cash collection for '+m.name,'cash',x.id);closeModal();render();syncCloud(false);});},
 newPurchase(){purchaseForm()},editPurchase(d){purchaseForm(state.purchaseOrders.find(x=>x.id===d.id))},deletePurchase(d){const x=state.purchaseOrders.find(x=>x.id===d.id);if(x&&confirmDelete(x.number)){state.purchaseOrders=state.purchaseOrders.filter(p=>p.id!==d.id);persist('Deleted '+x.number,'purchase',x.id);render();}},receivePurchase(d){const x=state.purchaseOrders.find(x=>x.id===d.id);if(!x||x.status==='Received')return;(x.items||[]).forEach(i=>{const p=productById(i.productId);if(p){p.onHand=Number(p.onHand||0)+Number(i.qty||0);p.cost=Number(i.unitCost||p.cost||0);state.inventoryHistory.unshift({id:uid(),at:new Date().toISOString(),productId:p.id,productName:p.name,change:Number(i.qty||0),reason:'Purchase '+x.number});}});x.status='Received';persist('Received '+x.number,'purchase',x.id);render();syncCloud(false);},
 addEmployee(){employeeForm()},editEmployee(d){employeeForm(state.employees.find(x=>x.id===d.id))},switchRole(d){const e=state.employees.find(x=>x.id===d.id);if(!e||!e.active)return;profile={email:e.name.toLowerCase().replace(/\s+/g,'.')+'@local',display_name:e.name,role:e.role};currentPage='dashboard';document.getElementById('userLine').textContent=`${e.name} • ${e.role.toUpperCase()}`;render();toast('Switched to '+e.name);},
 exportMachineReport(){downloadCSV('machine-report.csv',state.machines.map(m=>({machine:m.name,location:m.location,serial:m.serialNumber,card_reader:m.cardReaderId,commission_percent:m.commissionPercent,monthly_goal:m.monthlyGoal,last_service:m.lastService,next_service:m.nextService})))},
 exportServiceReport(){downloadCSV('service-report.csv',state.serviceRecords)},exportLossReport(){downloadCSV('loss-report.csv',state.issues.filter(i=>['Missing','Theft','Damaged','Expired'].includes(i.type)))},
 async cloudBackup(){try{await createCloudBackup('manual');toast('Cloud backup created.');render()}catch(e){toast(e.message)}},
 async restoreCloudBackup(){if(!confirm('Restore the latest cloud backup and replace this phone data?'))return;try{const r=await fetch(SUPABASE_URL+'/rest/v1/stb_state_backups?select=data,version,created_at&order=created_at.desc&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});const rows=await r.json();if(!rows.length)return toast('No cloud backup found.');state=Object.assign(starter(),rows[0].data,{pendingSync:true,cloudVersion:Number(rows[0].version||0)});ensureEnterpriseState();localStorage.setItem(LS,JSON.stringify(state));render();toast('Latest cloud backup restored. Tap Sync to save it.');}catch(e){toast('Restore failed.') }},
 useCloudCopy(){if(!state.syncConflict)return;state=Object.assign(starter(),state.syncConflict.remoteData,{cloudVersion:state.syncConflict.remoteVersion,pendingSync:false,syncConflict:null,lastSync:new Date().toISOString()});ensureEnterpriseState();localStorage.setItem(LS,JSON.stringify(state));render();toast('Cloud copy loaded.');},
 async keepPhoneCopy(){state.syncConflict=null;state.pendingSync=true;await syncCloud(true,'phone');}
});

erviceForm(null,m.id);else toast('No machine is linked to this stop address.');});document.getElementById('completeRoute').onclick=()=>{if(orders.some(o=>!o.checkIn))return toast('Check in at every stop first.');r.endMileage=num('routeEndMileage');if(Number(r.endMileage)<Number(r.startMileage))return toast('End mileage cannot be lower than start mileage.');r.status='Completed';r.completedAt=new Date().toISOString();persist('Completed route '+r.name,'route',r.id);closeModal();render();syncCloud(false);};},0);};


/* STR8 Team Messaging System */
function ensureMessagingState(){
  if(!Array.isArray(state.messages))state.messages=[];
  state.messages=state.messages.map(m=>Object.assign({id:uid(),senderName:'Unknown',senderRole:'',recipientType:'all',recipientValue:'all',subject:'',body:'',createdAt:new Date().toISOString(),readBy:[],archivedBy:[]},m));
}
ensureMessagingState();
Object.keys(roles).forEach(r=>{if(!roles[r].includes('messages'))roles[r].push('messages')});
labels.messages='Messages';
function currentWorkerKey(){return String(profile?.display_name||profile?.email||'user').trim().toLowerCase()}
function messageVisibleToMe(m){const me=currentWorkerKey(),myRole=role();return m.senderName?.trim().toLowerCase()===me||m.recipientType==='all'||(m.recipientType==='role'&&m.recipientValue===myRole)||(m.recipientType==='person'&&String(m.recipientValue||'').trim().toLowerCase()===me)}
function messageIsMine(m){return String(m.senderName||'').trim().toLowerCase()===currentWorkerKey()}
function messageUnread(m){return !messageIsMine(m)&&messageVisibleToMe(m)&&!(m.readBy||[]).includes(currentWorkerKey())}
function messageRecipientLabel(m){if(m.recipientType==='all')return 'Everyone';if(m.recipientType==='role')return (m.recipientValue||'').toUpperCase()+' team';return m.recipientValue||'Worker'}
function visibleMessages(filter='inbox',q=''){
  const needle=String(q||'').toLowerCase();
  return (state.messages||[]).filter(m=>{
    const mine=messageIsMine(m),visible=messageVisibleToMe(m),archived=(m.archivedBy||[]).includes(currentWorkerKey());
    if(filter==='sent'&&!mine)return false;
    if(filter==='unread'&&!messageUnread(m))return false;
    if(filter==='archived'&&!archived)return false;
    if(filter==='inbox'&&(!visible||mine||archived))return false;
    if(filter==='all'&&!visible)return false;
    if(filter!=='archived'&&archived)return false;
    return !needle||[m.subject,m.body,m.senderName,messageRecipientLabel(m)].join(' ').toLowerCase().includes(needle);
  }).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
}
function messageList(filter='inbox',q=''){
  const list=visibleMessages(filter,q);
  return list.length?list.map(m=>`<div class="subcard" style="${messageUnread(m)?'border-left:4px solid var(--gold)':''}"><div class="row wraprow"><div style="min-width:0"><div class="small muted">${messageUnread(m)?'<span class="pill warn">NEW</span> ':''}${esc(m.senderName)} → ${esc(messageRecipientLabel(m))} • ${new Date(m.createdAt).toLocaleString()}</div><b>${esc(m.subject||'No subject')}</b><div class="small" style="margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px">${esc(m.body||'')}</div></div><div class="actions"><button class="btn smallbtn" data-action="openMessage" data-id="${m.id}">Open</button>${!messageIsMine(m)?`<button class="btn secondary smallbtn" data-action="replyMessage" data-id="${m.id}">Reply</button>`:''}<button class="btn secondary smallbtn" data-action="archiveMessage" data-id="${m.id}">${(m.archivedBy||[]).includes(currentWorkerKey())?'Unarchive':'Archive'}</button>${messageIsMine(m)||isManagement()?`<button class="btn danger smallbtn" data-action="deleteMessage" data-id="${m.id}">Delete</button>`:''}</div></div></div>`).join(''):'<div class="empty">No messages here.</div>';
}
pages.messages=function(){ensureMessagingState();const unread=state.messages.filter(messageUnread).length;return `<div class="card"><div class="row wraprow"><div><h3>Team Messages</h3><div class="small muted">Send updates between owners, managers, warehouse workers, drivers and sales staff.</div></div><div class="actions"><span class="pill ${unread?'warn':'good'}">${unread} unread</span><button class="btn" data-action="newMessage">New Message</button></div></div><div class="searchbar"><input id="messageSearch" placeholder="Search messages"><select id="messageFilter"><option value="inbox">Inbox</option><option value="unread">Unread</option><option value="sent">Sent</option><option value="all">All visible</option><option value="archived">Archived</option></select></div><div id="messageList">${messageList('inbox','')}</div></div>`};
function messageRecipientOptions(selectedType='all',selectedValue='all'){
  const workers=(state.employees||[]).filter(e=>e.active!==false);
  const options=[`<option value="all|all" ${selectedType==='all'?'selected':''}>Everyone</option>`,...['owner','manager','warehouse','route','sales'].map(r=>`<option value="role|${r}" ${selectedType==='role'&&selectedValue===r?'selected':''}>${r.toUpperCase()} team</option>`),...workers.map(e=>`<option value="person|${esc(e.name)}" ${selectedType==='person'&&selectedValue===e.name?'selected':''}>${esc(e.name)} (${esc(e.role)})</option>`)];
  return options.join('');
}
function messageForm(replyTo=null){
  ensureMessagingState();
  const isReply=!!replyTo,subject=isReply?('Re: '+String(replyTo.subject||'').replace(/^Re:\s*/i,'')):'',body=isReply?`\n\n--- Original message from ${replyTo.senderName} ---\n${replyTo.body||''}`:'';
  const rt=isReply?'person':'all',rv=isReply?replyTo.senderName:'all';
  openModal(isReply?'Reply to Message':'New Message',`<label class="label">Send to</label><select id="msgRecipient">${messageRecipientOptions(rt,rv)}</select>${field('Subject','msgSubject',subject)}<label class="label">Message</label><textarea id="msgBody" style="min-height:180px">${esc(body)}</textarea><div class="small muted" style="margin-top:8px">Messages sync with the rest of the STR8 Vending cloud data.</div>`,()=>{
    const raw=val('msgRecipient').split('|'),subject=val('msgSubject'),body=val('msgBody');
    if(!subject)return toast('Enter a subject.');if(!body)return toast('Enter a message.');
    const m={id:uid(),senderName:profile?.display_name||profile?.email||'Worker',senderRole:role(),recipientType:raw[0]||'all',recipientValue:raw.slice(1).join('|')||'all',subject,body,createdAt:new Date().toISOString(),readBy:[currentWorkerKey()],archivedBy:[]};
    state.messages.push(m);persist('Sent message: '+subject,'message',m.id);closeModal();render();syncCloud(false);toast('Message sent.');
  });
}
function openMessageView(m){if(!m)return;if(messageVisibleToMe(m)&&!messageIsMine(m)){m.readBy=Array.isArray(m.readBy)?m.readBy:[];if(!m.readBy.includes(currentWorkerKey())){m.readBy.push(currentWorkerKey());persist('Read message: '+m.subject,'message',m.id);syncCloud(false);}}
  openModal(esc(m.subject||'Message'),`<div class="subcard"><div class="small muted">From</div><b>${esc(m.senderName)} (${esc(m.senderRole||'staff')})</b><div class="small muted" style="margin-top:9px">To</div><b>${esc(messageRecipientLabel(m))}</b><div class="small muted" style="margin-top:9px">Sent ${new Date(m.createdAt).toLocaleString()}</div></div><div class="subcard" style="white-space:pre-wrap;line-height:1.45">${esc(m.body||'')}</div>${!messageIsMine(m)?'<button type="button" class="btn" id="replyInsideMessage">Reply</button>':''}`,()=>{closeModal();render();},'Close');
  setTimeout(()=>{const b=document.getElementById('replyInsideMessage');if(b)b.onclick=()=>{closeModal();messageForm(m)}},0);
}
Object.assign(actions,{
  newMessage(){messageForm()},
  openMessage(d){openMessageView(state.messages.find(m=>String(m.id)===String(d.id)))},
  replyMessage(d){const m=state.messages.find(m=>String(m.id)===String(d.id));if(m)messageForm(m)},
  archiveMessage(d){const m=state.messages.find(m=>String(m.id)===String(d.id));if(!m)return;m.archivedBy=Array.isArray(m.archivedBy)?m.archivedBy:[];const k=currentWorkerKey(),i=m.archivedBy.indexOf(k);if(i>=0)m.archivedBy.splice(i,1);else m.archivedBy.push(k);persist((i>=0?'Unarchived':'Archived')+' message','message',m.id);render();syncCloud(false)},
  deleteMessage(d){const m=state.messages.find(m=>String(m.id)===String(d.id));if(!m||(!messageIsMine(m)&&!isManagement()))return toast('Only the sender or management can delete this message.');if(!confirm('Delete this message for everyone?'))return;state.messages=state.messages.filter(x=>String(x.id)!==String(d.id));persist('Deleted message','message',d.id);render();syncCloud(false)}
});
const messagingBindPage=bindPage;
bindPage=function(){messagingBindPage();const s=document.getElementById('messageSearch'),f=document.getElementById('messageFilter'),list=document.getElementById('messageList');const refresh=()=>{if(list)list.innerHTML=messageList(f?.value||'inbox',s?.value||'');messagingBindPage()};if(s)s.oninput=refresh;if(f)f.onchange=refresh;};

const originalInit=init;
init=async function(){ensureEnterpriseState();await originalInit();ensureEnterpriseState();autoBackup();};

bindGlobal();init();
