.wrap{max-width:760px;margin:auto;padding:18px} .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px} .hidden{display:none}

function editLevels(mi,key){let m=data.machines[mi];openOps('Edit Levels — '+m.id,photo(key)+'<label>Current machine stock</label><input type=number min=0 id=oStock value="'+Number(m.stock[key]||0)+'"><label>Par level</label><input type=number min=0 id=oPar value="'+Number(m.par[key]||0)+'"><label>Units sold</label><input type=number min=0 id=oSold value="'+Number(m.sales[key]||0)+'">',()=>{m.stock[key]=num('oStock');m.par[key]=num('oPar');m.sales[key]=num('oSold');save();closeOps();showPage('restock')})}
function recordSale(mi,key){let m=data.machines[mi],available=Number(m.stock[key]||0);openOps('Record Sale — '+m.id,photo(key)+'<label>Product</label><input value="'+esc(data.products[key]||key)+'" disabled><label>Units sold</label><input type=number inputmode=numeric min=1 max="'+available+'" id=oSale value=1><button type=button class=btn id=scanSale style="margin-top:10px">Scan Product Barcode</button><div class="small muted">Current machine stock: '+available+'</div>',()=>{let q=Math.max(1,num('oSale'));if(q>available)return alert('Not enough stock in this machine.');m.stock[key]=available-q;m.sales[key]=Number(m.sales[key]||0)+q;save();closeOps();showPage('restock')})}
function renderOrders(){const c=document.getElementById('content');c.innerHTML='<div class=row><div><h3 style="margin:0">Sales Orders</h3><div class="small muted">Create, pick, and deliver orders</div></div><button class=btn id=addOrder style="width:auto">+ New Order</button></div>'+data.orders.slice().sort((a,b)=>b.created-a.created).map(o=>{let units=o.items.reduce((a,it)=>a+Number(it.qty||0),0),picked=o.items.reduce((a,it)=>a+Number(it.picked||0),0);return '<div class=prospect><div class=ptop><div><b>'+esc(o.id)+' — '+esc(o.customer)+'</b><div class="small muted">'+new Date(o.created).toLocaleString()+' · '+units+' units</div></div><span class="badge '+(o.status==='Delivered'?'picked':'pending')+'">'+esc(o.status)+'</span></div>'+o.items.map(it=>'<div class=order-item>'+photo(it.key,'productphoto')+'<div><b>'+esc(data.products[it.key]||it.key)+'</b><div class="small muted">Picked '+Number(it.picked||0)+' / '+Number(it.qty||0)+'</div></div><b>'+Number(it.qty||0)+'</b></div>').join('')+'<div class=actions><button class=btn data-order-edit="'+esc(o.id)+'">Edit</button><button class=btn data-order-pick="'+esc(o.id)+'">Pick ('+picked+'/'+units+')</button><button class=btn data-order-deliver="'+esc(o.id)+'">'+(o.status==='Delivered'?'Delivered':'Mark Delivered')+'</button></div></div>'}).join('')||'<p class=muted>No orders yet.</p>'}
function orderForm(order){let o=order||{id:'ORD-'+Date.now().toString().slice(-6),customer:'',items:[]};let itemMap={};o.items.forEach(it=>itemMap[it.key]=Number(it.qty||0));let html='<label>Order Number</label><input id=oOrderId value="'+esc(o.id)+'"><label>Customer / Delivery Location</label><input id=oCustomer value="'+esc(o.customer)+'"><h4>Products</h4><button type=button class=btn id=scanOrderProduct>Scan Product to Add</button>'+Object.keys(data.products).map(k=>'<div class=order-item>'+photo(k,'productphoto')+'<div><b>'+esc(data.products[k])+'</b><div class="small muted">Warehouse '+Number(data.inventory[k]||0)+' · '+esc((data.productMeta[k]||{}).barcode||'No barcode')+'</div></div><input style="width:82px" type=number min=0 inputmode=numeric id="ord_'+k+'" value="'+(itemMap[k]||0)+'"></div>').join('');openOps(order?'Edit Order':'New Order',html,()=>{let id=document.getElementById('oOrderId').value.trim(),customer=document.getElementById('oCustomer').value.trim();if(!id||!customer)return alert('Order number and customer are required.');let items=Object.keys(data.products).map(k=>({key:k,qty:num('ord_'+k),picked:(o.items.find(x=>x.key===k)||{}).picked||0})).filter(it=>it.qty>0);if(!items.length)return alert('Add at least one product.');let found=data.orders.findIndex(x=>x.id===o.id),saved={id,customer,items,created:o.created||Date.now(),status:o.status||'Open'};if(found>=0)data.orders[found]=saved;else data.orders.push(saved);save();closeOps();showPage('orders')})}
function pickOrder(id){let o=data.orders.find(x=>x.id===id);if(!o)return;let draw=()=>{let done=o.items.every(it=>Number(it.picked||0)>=Number(it.qty||0));let html='<div class="small muted">Scan each product as you place it in the delivery order.</div><button type=button class=btn id=scanPick style="margin:10px 0">Scan Next Product</button>'+o.items.map((it,idx)=>'<div class=order-item>'+photo(it.key,'productphoto')+'<div><b>'+esc(data.products[it.key]||it.key)+'</b><div class="small muted">Barcode '+esc((data.productMeta[it.key]||{}).barcode||'Not set')+'</div></div><div><b>'+Number(it.picked||0)+' / '+Number(it.qty||0)+'</b><button type=button class=btn data-pick-manual="'+idx+'" style="margin-top:6px;padding:7px">+1</button></div></div>').join('')+(done?'<div class="good" style="padding:12px 0;font-weight:800">✓ Order fully picked</div>':'');openOps('Pick '+o.id,html,null);document.getElementById('opsBody').dataset.orderPick=id};draw()}
function handlePickedBarcode(code){let box=document.getElementById('opsBody'),id=box.dataset.orderPick,o=data.orders.find(x=>x.id===id);if(!o)return;let key=productByBarcode(code);if(!key)return alert('This barcode is not assigned to a product.');let it=o.items.find(x=>x.key===key);if(!it)return alert('That product is not on this order.');if(Number(it.picked||0)>=Number(it.qty||0))return alert('That product is already fully picked.');if(Number(data.inventory[key]||0)<=0)return alert('No warehouse inventory available.');it.picked=Number(it.picked||0)+1;data.inventory[key]=Number(data.inventory[key]||0)-1;o.status=o.items.every(x=>Number(x.picked||0)>=Number(x.qty||0))?'Picked':'Picking';save();pickOrder(id)}
async function startScanner(callback){scanCallback=callback;document.getElementById('manualBarcode').value='';document.getElementById('scannerModal').classList.add('open');if(typeof Html5Qrcode==='undefined'){document.getElementById('scanHelp').textContent='Camera scanner unavailable. Enter the barcode manually below.';return}try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},code=>finishScan(code),()=>{})}catch(e){document.getElementById('scanHelp').textContent='Camera permission failed. Enter the barcode manually below.'}}
async function stopScanner(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}document.getElementById('scannerModal').classList.remove('open');document.getElementById('reader').innerHTML=''}
async function finishScan(code){let cb=scanCallback;await stopScanner();scanCallback=null;if(cb)cb(String(code).trim())}
function renderProspects(){const c=document.getElementById('content');let areas=[...new Set(data.prospects.map(p=>p.area).filter(Boolean))].sort();c.innerHTML='<div class=row><div><h3 style="margin:0">Prospects</h3><div class="muted small">'+data.prospects.length+' Charleston-area leads</div></div><button class="btn" id="addP" style="width:auto">+ Add</button></div><div class=filters><input id="pSearch" placeholder="Search business, phone, area, category"><select id="pFilter"><option value="">All statuses</option><option>No</option><option>Called</option><option>Interested</option><option>Visit Set</option><option>Agreement Sent</option><option>Won</option><option>Not Interested</option><option>Bad Number</option><option>Closed</option></select></div><div class=filters3><select id="pArea"><option value="">All areas</option>'+areas.map(a=>'<option>'+esc(a)+'</option>').join('')+'</select><select id="pPriority"><option value="">All priorities</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="pVerified"><option value="">All verification</option><option value="verified">Verified online</option><option value="verify">Needs verification</option></select></div><div id="pList"></div>';['pSearch','pFilter','pArea','pPriority','pVerified'].forEach(id=>document.getElementById(id).addEventListener(id==='pSearch'?'input':'change',drawProspects));document.getElementById('addP').onclick=()=>openProspect();drawProspects()}
function drawProspects(){let q=(document.getElementById('pSearch').value||'').toLowerCase(),f=document.getElementById('pFilter').value,a=document.getElementById('pArea').value,pr=document.getElementById('pPriority').value,v=document.getElementById('pVerified').value;let list=data.prospects.filter(p=>(!q||[p.business,p.category,p.area,p.address,p.phone,p.contact,p.notes].join(' ').toLowerCase().includes(q))&&(!f||p.status===f)&&(!a||p.area===a)&&(!pr||p.priority===pr)&&(!v||(v==='verified'?String(p.verification).toLowerCase().includes('verified'):!String(p.verification).toLowerCase().includes('verified')))).sort((x,y)=>({Easy:0,Medium:1,Hard:2}[x.priority]??9)-({Easy:0,Medium:1,Hard:2}[y.priority]??9)||x.business.localeCompare(y.business));document.getElementById('pList').innerHTML=list.map(p=>'<div class=prospect><div class=ptop><div><b>'+esc(p.business)+'</b><div class="muted small">'+esc(p.category)+' · '+esc(p.area)+'</div></div><span class="pill '+String(p.priority).toLowerCase()+'">'+esc(p.priority)+'</span></div><div class=small style="margin-top:7px">'+esc(p.address)+'</div><div class=small style="margin-top:5px">'+(p.phone?'<a class=good href="tel:'+String(p.phone).replace(/\D/g,'')+'">'+esc(p.phone)+'</a>':'No phone listed')+'</div><div class="small muted" style="margin-top:6px">'+esc(p.verification||'Needs verification')+'</div><div class=row><span>Status</span><b>'+esc(p.status||'No')+'</b></div>'+(p.followUp?'<div class=row><span>Follow-up</span><b>'+esc(p.followUp)+'</b></div>':'')+'<div class=actions><button type=button class=btn data-edit-id="'+p.id+'">Edit</button>'+(p.phone?'<a class=btn href="tel:'+String(p.phone).replace(/\D/g,'')+'">Call</a>':'<button class=btn disabled>No Phone</button>')+(p.source?'<a class=btn href="'+esc(p.source)+'" target="_blank" rel="noopener">Source</a>':'<button class=btn disabled>No Source</button>')+'</div></div>').join('')||'<p class=muted>No matching prospects.</p>'}
function openProspect(id){editingId=id||null;let p=id?data.prospects.find(x=>x.id===id):{priority:'Easy',status:'No'};document.getElementById('modalTitle').textContent=id?'Edit Prospect':'Add Prospect';[['Business','business'],['Category','category'],['Area','area'],['Phone','phone'],['Address','address'],['Priority','priority'],['Status','status'],['Contact','contact'],['FollowUp','followUp'],['Verification','verification'],['Source','source'],['Notes','notes']].forEach(([field,key])=>document.getElementById('f'+field).value=p[key]||'');document.getElementById('prospectModal').classList.add('open')}
function closeModal(){document.getElementById('prospectModal').classList.remove('open')}
function saveProspect(){let business=document.getElementById('fBusiness').value.trim();if(!business)return alert('Business name is required.');let p={id:editingId||Date.now(),business,category:document.getElementById('fCategory').value.trim(),area:document.getElementById('fArea').value.trim(),phone:document.getElementById('fPhone').value.trim(),address:document.getElementById('fAddress').value.trim(),priority:document.getElementById('fPriority').value,status:document.getElementById('fStatus').value,contact:document.getElementById('fContact').value.trim(),followUp:document.getElementById('fFollowUp').value,verification:document.getElementById('fVerification').value.trim(),source:document.getElementById('fSource').value.trim(),notes:document.getElementById('fNotes').value.trim()};let i=data.prospects.findIndex(x=>x.id===p.id);if(i>=0)data.prospects[i]=p;else data.prospects.unshift(p);save();closeModal();renderProspects()}
function bindApp(){document.getElementById('logout').addEventListener('click',()=>{try{localStorage.removeItem('str8_login')}catch(e){}location.reload()});document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)showPage(b.dataset.page)});document.getElementById('content').addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
if(t.id==='addMachine')addMachine();else if(t.dataset.machineEdit!=null)addMachine(Number(t.dataset.machineEdit));else if(t.dataset.machineStock!=null)editMachineStock(Number(t.dataset.machineStock));else if(t.dataset.machineDelete!=null){let i=Number(t.dataset.machineDelete);if(confirm('Delete this machine?')){data.machines.splice(i,1);save();showPage('machines')}}
else if(t.id==='addProduct')addProduct();else if(t.dataset.productEdit)addProduct(t.dataset.productEdit);else if(t.dataset.productAdjust)adjustProduct(t.dataset.productAdjust);else if(t.dataset.productDelete){let k=t.dataset.productDelete;if(confirm('Delete this product everywhere?')){delete data.products[k];delete data.inventory[k];delete data.productMeta[k];data.machines.forEach(m=>{delete m.stock[k];delete m.par[k];delete m.sales[k]});save();showPage('inventory')}}
else if(t.dataset.restock){let [i,k]=t.dataset.restock.split('|');restockMachine(Number(i),k)}else if(t.dataset.stockEdit){let [i,k]=t.dataset.stockEdit.split('|');editLevels(Number(i),k)}else if(t.dataset.recordSale){let [i,k]=t.dataset.recordSale.split('|');recordSale(Number(i),k)}
else if(t.id==='addOrder')orderForm();else if(t.dataset.orderEdit)orderForm(data.orders.find(o=>o.id===t.dataset.orderEdit));else if(t.dataset.orderPick)pickOrder(t.dataset.orderPick);else if(t.dataset.orderDeliver){let o=data.orders.find(x=>x.id===t.dataset.orderDeliver);if(o){if(!o.items.every(it=>Number(it.picked||0)>=Number(it.qty||0)))return alert('Finish picking the order first.');o.status='Delivered';save();showPage('orders')}}else if(t.dataset.editId)openProspect(Number(t.dataset.editId))});
document.getElementById('closeModal').onclick=closeModal;document.getElementById('saveProspect').onclick=saveProspect;document.getElementById('prospectModal').onclick=e=>{if(e.target.id==='prospectModal')closeModal()};document.getElementById('closeOps').onclick=closeOps;document.getElementById('opsModal').addEventListener('click',e=>{if(e.target.id==='opsModal')closeOps();let t=e.target.closest('button');if(!t)return;if(t.id==='scanProductBarcode')startScanner(code=>document.getElementById('oBarcode').value=code);else if(t.id==='scanRestock'||t.id==='scanSale'){let expected=t.id==='scanRestock'?document.querySelector('#opsBody input[disabled]').value:document.querySelector('#opsBody input[disabled]').value;startScanner(code=>{let k=productByBarcode(code);if(!k||data.products[k]!==expected)alert('Wrong product scanned. Expected '+expected);else alert('Product verified.')})}else if(t.id==='scanOrderProduct')startScanner(code=>{let k=productByBarcode(code);if(!k)return alert('Barcode is not assigned to a product.');let el=document.getElementById('ord_'+k);el.value=(Number(el.value)||0)+1});else if(t.id==='scanPick')startScanner(handlePickedBarcode);else if(t.dataset.pickManual!=null){let id=document.getElementById('opsBody').dataset.orderPick,o=data.orders.find(x=>x.id===id),it=o&&o.items[Number(t.dataset.pickManual)];if(it){if(Number(it.picked||0)>=Number(it.qty||0))return alert('That product is already fully picked.');if(Number(data.inventory[it.key]||0)<=0)return alert('No warehouse inventory available.');it.picked=Number(it.picked||0)+1;data.inventory[it.key]=Number(data.inventory[it.key]||0)-1;o.status=o.items.every(x=>Number(x.picked||0)>=Number(x.qty||0))?'Picked':'Picking';save();pickOrder(id)}}else if(t.dataset.scanStock){let k=t.dataset.scanStock;startScanner(code=>{let found=productByBarcode(code);if(found!==k)return alert('Wrong product scanned.');let el=document.getElementById('stk_'+k);el.value=(Number(el.value)||0)+1})}});document.getElementById('closeScanner').onclick=stopScanner;document.getElementById('useManualBarcode').onclick=()=>{let code=document.getElementById('manualBarcode').value.trim();if(!code)return alert('Enter a barcode.');finishScan(code)}}
bindApp();showPage('dashboard');
</script></body></html>
