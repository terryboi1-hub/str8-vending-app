<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<title>STR8 Vending Operations</title>
<style>
:root{--bg:#07101c;--panel:#142033;--panel2:#0c1728;--line:#344763;--text:#fff;--muted:#aab6c9;--accent:#b52543;--accent2:#8e1d36;--gold:#e1a535;--green:#9df1bf;--red:#ff9dad;--blue:#9ecbff}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.subcard{background:var(--panel2);border:1px solid #31435e;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wraprow{flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:12px}.good{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}h1,h2,h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;text-align:center}.btn.secondary{background:#253753}.btn.good{background:#17613d}.btn.warn{background:#70500f}.btn.danger{background:#7f1d1d}.btn.smallbtn{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.input,input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #425571;background:#0b1525;color:#fff}textarea{min-height:80px}.grid2,.grid3,.grid4{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}.nav button{white-space:nowrap;border:1px solid #425571;background:#17243a;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.nav button.active{background:var(--accent)}.stat{background:var(--panel2);border:1px solid #31435e;border-radius:14px;padding:12px}.stat b{font-size:22px;display:block;margin-top:3px}.product{display:grid;grid-template-columns:70px 1fr auto;gap:11px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.photo{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#09111e;border:1px solid #425571}.photo.placeholder{display:grid;place-items:center;font-size:30px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#253753;font-size:11px;font-weight:800}.pill.good{background:#163e2b}.pill.warn{background:#5a4012}.pill.bad{background:#541928}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(900px,100%);max-height:94vh;overflow:auto;background:#111c2d;border-radius:18px 18px 0 0;padding:16px}.label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c2d;border:1px solid #425571;border-radius:12px;padding:12px 16px;z-index:100;display:none;max-width:90%}.toast.show{display:block}.scanner{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center;padding:14px}.scanner.open{display:flex}.scanner-panel{width:min(700px,100%);background:#111c2d;border-radius:16px;padding:14px}.reader{min-height:280px;background:#05080d;border-radius:12px;overflow:hidden}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(460px,100%)}.hidden{display:none!important}.offline{background:#70500f;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.online{background:#17613d;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.route-stop{border-left:4px solid var(--accent);padding-left:12px}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:auto}.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}.searchbar{display:grid;grid-template-columns:2fr 1fr;gap:8px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:760px){.grid4,.grid3,.grid2{grid-template-columns:1fr}.product{grid-template-columns:58px 1fr}.product>.actions{grid-column:1/-1}.photo{width:58px;height:58px}.searchbar{grid-template-columns:1fr}.wrap{padding:10px}.sheet{border-radius:18px 18px 0 0}}
@media(min-width:761px){.modal{align-items:center}.sheet{border-radius:18px}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="card">
    <h1>STR8 Vending</h1><div class="muted">Cloud operations, inventory, orders, routes and sales.</div>
    <label class="label">Email</label><input id="loginEmail" type="email" placeholder="owner@stbdistribution.com" autocomplete="username">
    <label class="label">Password</label><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:12px">Sign In</button>
    <button class="btn secondary" id="resetPasswordBtn" style="width:100%;margin-top:8px">Reset Password</button>
    <button class="btn secondary" id="demoBtn" style="width:100%;margin-top:8px">Open Demo Mode</button>
    <div id="loginMsg" class="small muted" style="margin-top:10px"></div>
  </div>
</div>
<div id="app" class="wrap hidden">
  <div class="sticky">
    <div class="card">
      <div class="row wraprow"><div><h2>STR8 Vending</h2><div id="userLine" class="small muted"></div></div><div class="actions"><span id="networkBadge" class="online">Online</span><button class="btn secondary smallbtn" id="syncBtn">Sync</button><button class="btn danger smallbtn" id="logoutBtn">Log Out</button></div></div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div id="content"></div>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h3 id="modalTitle">Edit</h3><button class="btn secondary smallbtn" id="closeModal">Close</button></div><div id="modalBody"></div><div class="actions" style="margin-top:14px"><button class="btn" id="saveModal">Save</button></div></div></div>
<div id="scanner" class="scanner"><div class="scanner-panel"><div class="row"><div><h3>Scan Barcode</h3><div class="small muted">Point your camera at the UPC or barcode.</div></div><button class="btn secondary smallbtn" id="closeScanner">Close</button></div><div id="reader" class="reader"></div><label class="label">Manual barcode</label><div class="grid2"><input id="manualBarcode" inputmode="numeric" placeholder="Type barcode"><button class="btn" id="useBarcode">Use Barcode</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://ijbyfxxykueujunshtsy.supabase.co';
const SUPABASE_KEY='sb_publishable_5nrx2r9mdJ_nbitdZHcMrw_uWZtrnYw';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const LS='str8_vending_enterprise_v3'; const BACKUPS='str8_vending_backups_v1';
const roles={owner:['dashboard','machines','inventory','orders','routes','sales','issues','prospects','activity','settings'],manager:['dashboard','machines','inventory','orders','routes','sales','issues','prospects','activity'],warehouse:['dashboard','inventory','orders','routes','issues'],route:['dashboard','machines','orders','routes','sales','issues'],sales:['dashboard','orders','prospects']};
const labels={dashboard:'Dashboard',machines:'Machines',inventory:'Inventory',orders:'Orders',routes:'Routes',sales:'Sales',issues:'Issues',prospects:'Prospects',activity:'Activity',settings:'Settings'};
let user=null,profile=null,demo=false,currentPage='dashboard',modalSave=null,scannerCallback=null,scannerObj=null;
function starter(){return {version:3,updatedAt:new Date().toISOString(),products:[
{id:'p1',sku:'COKE20',barcode:'049000050103',name:'Coke 20 oz',category:'Drink',cost:1.05,price:2.50,onHand:48,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true},
{id:'p2',sku:'SPRITE20',barcode:'049000050202',name:'Sprite 20 oz',category:'Drink',cost:1.05,price:2.50,onHand:36,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true},
{id:'p3',sku:'CHIPS1',barcode:'028400090896',name:'Classic Chips',category:'Snack',cost:.62,price:1.50,onHand:60,reorder:24,reorderQty:48,supplier:'Warehouse',photo:'',active:true}],machines:[],machineStock:[],customers:[],orders:[],routes:[],sales:[],issues:[],prospects:[],activity:[],settings:{company:'STR8 TO BUSINESS LLC',lowStock:true,currency:'USD'},pendingSync:false,lastSync:null};}
let state=loadState();
function loadState(){try{return Object.assign(starter(),JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){return starter();}}
function persist(logText,entity,entityId){state.updatedAt=new Date().toISOString();state.pendingSync=true;localStorage.setItem(LS,JSON.stringify(state));if(logText)logActivity(logText,entity,entityId,false);renderNetwork();}
function logActivity(action,entity='',entityId='',doPersist=true){state.activity.unshift({id:uid(),at:new Date().toISOString(),user:profile?.email||user?.email||'demo',role:profile?.role||'demo',action,entity,entityId});state.activity=state.activity.slice(0,1000);if(doPersist){state.pendingSync=true;localStorage.setItem(LS,JSON.stringify(state));}}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return '$'+Number(v||0).toFixed(2)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function confirmDelete(name){return confirm('Delete '+name+'? This cannot be undone.');}
function role(){return profile?.role||'owner'}
function can(page){return (roles[role()]||roles.owner).includes(page)}
function renderNav(){document.getElementById('nav').innerHTML=(roles[role()]||roles.owner).map(p=>`<button data-page="${p}" class="${p===currentPage?'active':''}">${labels[p]}</button>`).join('');}
function render(){if(!can(currentPage))currentPage=(roles[role()]||roles.owner)[0];renderNav();const fn=pages[currentPage]||pages.dashboard;document.getElementById('content').innerHTML=fn();bindPage();}
function renderNetwork(){const b=document.getElementById('networkBadge');if(!b)return;const on=navigator.onLine;b.textContent=on?(state.pendingSync?'Online • Unsynced':'Online • Synced'):'Offline Mode';b.className=on?'online':'offline';}
function bindPage(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>actions[el.dataset.action]?.(el.dataset));document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{currentPage=el.dataset.page;render();});}
function openModal(title,html,onSave,saveLabel='Save'){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('saveModal').textContent=saveLabel;modalSave=onSave;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');modalSave=null;}
async function compressImage(file,max=700,quality=.75){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w*=s;h*=s;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=r.result;};r.readAsDataURL(file);});}
async function startScanner(cb){scannerCallback=cb;document.getElementById('scanner').classList.add('open');document.getElementById('manualBarcode').value='';if(window.Html5Qrcode){try{scannerObj=new Html5Qrcode('reader');await scannerObj.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},code=>finishScan(code));}catch(e){toast('Camera unavailable. Type the barcode instead.');}}}
async function stopScanner(){if(scannerObj){try{await scannerObj.stop();await scannerObj.clear();}catch(e){}scannerObj=null;}document.getElementById('scanner').classList.remove('open');}
async function finishScan(code){const cb=scannerCallback;await stopScanner();scannerCallback=null;if(cb)cb(String(code).trim());}
function productPhoto(p){return p.photo?`<img class="photo" src="${p.photo}" alt="${esc(p.name)}">`:`<div class="photo placeholder">📦</div>`}
function totals(){const sales=state.sales.reduce((a,s)=>a+Number(s.cash||0)+Number(s.card||0),0);const cogs=state.sales.reduce((a,s)=>a+Number(s.cost||0),0);const commission=state.sales.reduce((a,s)=>a+Number(s.commission||0),0);return {sales,cogs,commission,profit:sales-cogs-commission};}
const pages={
dashboard(){const t=totals();const low=state.products.filter(p=>p.active!==false&&Number(p.onHand)<=Number(p.reorder));const open=state.orders.filter(o=>!['Checked In','Cancelled'].includes(o.status));const route=state.routes.filter(r=>r.status!=='Completed');return `<div class="grid4"><div class="stat"><span class="muted">Machines</span><b>${state.machines.length}</b></div><div class="stat"><span class="muted">Low Stock</span><b class="${low.length?'bad':'good'}">${low.length}</b></div><div class="stat"><span class="muted">Open Orders</span><b>${open.length}</b></div><div class="stat"><span class="muted">Net Profit</span><b class="good">${money(t.profit)}</b></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Needs Attention</h3>${low.length?low.slice(0,8).map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="bad">${p.onHand} left</b></div>`).join(''):'<div class="empty">No low-stock products.</div>'}</div><div class="card"><h3>Next Work</h3><div class="row"><span>Orders waiting</span><b>${open.length}</b></div><div class="row"><span>Routes active</span><b>${route.length}</b></div><div class="row"><span>Open issues</span><b>${state.issues.filter(i=>i.status!=='Resolved').length}</b></div><div class="row"><span>Unsynced changes</span><b>${state.pendingSync?'Yes':'No'}</b></div></div></div>`;},
machines(){return `<div class="card"><div class="row wraprow"><div><h3>Machines</h3><div class="small muted">Track location, cash/card totals and exact machine stock.</div></div><button class="btn" data-action="addMachine">Add Machine</button></div>${state.machines.length?state.machines.map(m=>{const stock=state.machineStock.filter(x=>x.machineId===m.id);const value=stock.reduce((a,x)=>{const p=state.products.find(p=>p.id===x.productId);return a+Number(x.qty||0)*Number(p?.price||0)},0);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(m.name)}</b><div class="small muted">${esc(m.location||'No location')} • ${esc(m.address||'')}</div><div class="small">Status: <span class="pill ${m.status==='Active'?'good':'warn'}">${esc(m.status)}</span> • Stock value ${money(value)}</div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editMachine" data-id="${m.id}">Edit</button><button class="btn smallbtn" data-action="editStock" data-id="${m.id}">Edit Stock</button><button class="btn danger smallbtn" data-action="deleteMachine" data-id="${m.id}">Delete</button></div></div></div>`}).join(''):'<div class="empty">No machines yet.</div>'}</div>`;},
inventory(){const q='';return `<div class="card"><div class="row wraprow"><div><h3>Inventory</h3><div class="small muted">Photos, barcode, cost, price, stock and profit.</div></div><div class="actions"><button class="btn" data-action="addProduct">Add Product</button><button class="btn secondary" data-action="exportInventory">Export CSV</button></div></div><div class="searchbar"><input id="inventorySearch" placeholder="Search product, SKU or barcode"><select id="inventoryFilter"><option value="all">All products</option><option value="low">Low stock</option><option value="inactive">Inactive</option></select></div><div id="inventoryList">${inventoryList('','all')}</div></div>`;},
orders(){return `<div class="card"><div class="row wraprow"><div><h3>Orders</h3><div class="small muted">Create orders with photos, scan products and pick for delivery.</div></div><div class="actions"><button class="btn" data-action="newOrder">New Order</button><button class="btn secondary" data-action="exportOrders">Export CSV</button></div></div><div class="searchbar"><input id="orderSearch" placeholder="Search customer or order"><select id="orderStatus"><option>All</option>${['New','Picking','Ready','Out for Service','Checked In','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderList">${orderList('','All')}</div></div>`;},
routes(){return `<div class="card"><div class="row wraprow"><div><h3>Delivery Routes</h3><div class="small muted">Build service routes and check in at each vending-machine location using the phone’s current GPS position.</div></div><button class="btn" data-action="newRoute">Create Route</button></div>${state.routes.length?state.routes.map(r=>{const orders=r.orderIds.map(id=>state.orders.find(o=>o.id===id)).filter(Boolean);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.date)} • ${orders.length} stops • ${esc(r.driver||'Unassigned')}</div><span class="pill ${r.status==='Completed'?'good':'warn'}">${esc(r.status)}</span></div><div class="actions"><button class="btn smallbtn" data-action="openRoute" data-id="${r.id}">Open Route</button><button class="btn secondary smallbtn" data-action="editRoute" data-id="${r.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteRoute" data-id="${r.id}">Delete</button></div></div></div>`}).join(''):'<div class="empty">No routes created.</div>'}</div>`;},
sales(){const t=totals();return `<div class="grid4"><div class="stat"><span class="muted">Gross Sales</span><b>${money(t.sales)}</b></div><div class="stat"><span class="muted">Product Cost</span><b>${money(t.cogs)}</b></div><div class="stat"><span class="muted">Commission</span><b>${money(t.commission)}</b></div><div class="stat"><span class="muted">Net Profit</span><b class="good">${money(t.profit)}</b></div></div><div class="card" style="margin-top:12px"><div class="row wraprow"><div><h3>Sales Records</h3><div class="small muted">Track machine cash, card sales and profitability.</div></div><div class="actions"><button class="btn" data-action="addSale">Add Sale</button><button class="btn secondary" data-action="exportSales">Export CSV</button></div></div>${state.sales.length?state.sales.map(s=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(s.date)} • ${esc(s.location||s.machineName||'Sale')}</b><div class="small">Cash ${money(s.cash)} • Card ${money(s.card)} • Cost ${money(s.cost)} • Commission ${money(s.commission)}</div><div class="good">Profit ${money(Number(s.cash||0)+Number(s.card||0)-Number(s.cost||0)-Number(s.commission||0))}</div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editSale" data-id="${s.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteSale" data-id="${s.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No sales recorded.</div>'}</div>`;},
issues(){return `<div class="card"><div class="row wraprow"><div><h3>Returns, Damage, Expiration & Missing Stock</h3></div><button class="btn" data-action="addIssue">Record Issue</button></div>${state.issues.length?state.issues.map(i=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(i.type)} • ${esc(i.productName||'General')}</b><div class="small muted">Qty ${i.qty||0} • ${esc(i.location||'')} • ${esc(i.date||'')}</div><div>${esc(i.notes||'')}</div><span class="pill ${i.status==='Resolved'?'good':'warn'}">${esc(i.status)}</span></div><div class="actions"><button class="btn secondary smallbtn" data-action="editIssue" data-id="${i.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteIssue" data-id="${i.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No issues recorded.</div>'}</div>`;},
prospects(){return `<div class="card"><div class="row wraprow"><div><h3>Prospects</h3><div class="small muted">Track vending leads and follow-ups.</div></div><button class="btn" data-action="addProspect">Add Prospect</button></div><input id="prospectSearch" placeholder="Search business, area or status"> <div id="prospectList">${prospectList('')}</div></div>`;},
activity(){return `<div class="card"><div class="row"><div><h3>Activity History</h3><div class="small muted">Who changed what and when.</div></div><button class="btn secondary" data-action="exportActivity">Export CSV</button></div>${state.activity.length?state.activity.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div class="small muted">${esc(a.user)} • ${esc(a.role)} • ${new Date(a.at).toLocaleString()}</div></div><span class="small">${esc(a.entity||'')}</span></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`;},
settings(){const backups=getBackups();return `<div class="grid2"><div class="card"><h3>Cloud & Backups</h3><div class="row"><span>Last cloud sync</span><b>${state.lastSync?new Date(state.lastSync).toLocaleString():'Never'}</b></div><button class="btn" data-action="manualSync" style="width:100%;margin-top:10px">Sync Now</button><button class="btn secondary" data-action="makeBackup" style="width:100%;margin-top:8px">Create Backup</button><button class="btn secondary" data-action="exportBackup" style="width:100%;margin-top:8px">Download Full Backup</button><label class="label">Restore backup file</label><input id="restoreFile" type="file" accept="application/json"></div><div class="card"><h3>Install & Testing</h3><button class="btn secondary" data-action="installApp" style="width:100%">Install on Home Screen</button><button class="btn warn" data-action="resetDemo" style="width:100%;margin-top:8px">Reset Demo Data</button><div class="small muted" style="margin-top:10px">On iPhone, Safari may require Share → Add to Home Screen.</div><h3 style="margin-top:18px">Local Snapshots</h3>${backups.slice(0,5).map((b,i)=>`<div class="row"><span>${new Date(b.at).toLocaleString()}</span><button class="btn secondary smallbtn" data-action="restoreSnapshot" data-index="${i}">Restore</button></div>`).join('')||'<div class="muted">No snapshots.</div>'}</div></div>`;}}
function inventoryList(search,filter){let arr=state.products.filter(p=>{const s=(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(search.toLowerCase());const f=filter==='all'||(filter==='low'&&p.onHand<=p.reorder)||(filter==='inactive'&&p.active===false);return s&&f});return arr.length?arr.map(p=>`<div class="product">${productPhoto(p)}<div><b>${esc(p.name)}</b><div class="small muted">SKU ${esc(p.sku)} • UPC ${esc(p.barcode||'None')} • ${esc(p.category||'')}</div><div>On hand <b class="${p.onHand<=p.reorder?'bad':'good'}">${p.onHand}</b> • Reorder ${p.reorder}</div><div class="small">Cost ${money(p.cost)} • Price ${money(p.price)} • Unit profit <span class="good">${money(p.price-p.cost)}</span></div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editProduct" data-id="${p.id}">Edit</button><button class="btn smallbtn" data-action="adjustInventory" data-id="${p.id}">Adjust</button><button class="btn danger smallbtn" data-action="deleteProduct" data-id="${p.id}">Delete</button></div></div>`).join(''):'<div class="empty">No matching products.</div>'}
function orderList(search,status){let arr=state.orders.filter(o=>(o.customerName+' '+o.number).toLowerCase().includes(search.toLowerCase())&&(status==='All'||o.status===status));return arr.length?arr.map(o=>{const total=o.items.reduce((a,i)=>{const p=state.products.find(p=>p.id===i.productId);return a+Number(i.qty||0)*Number(p?.price||0)},0);const picked=o.items.reduce((a,i)=>a+Number(i.picked||0),0),needed=o.items.reduce((a,i)=>a+Number(i.qty||0),0);return `<div class="subcard"><div class="row wraprow"><div><b>${esc(o.number)} • ${esc(o.customerName)}</b><div class="small muted">${esc(o.deliveryDate||'No date')} • ${esc(o.address||'')} • ${money(total)}</div><div class="small">Picked ${picked}/${needed} • Payment ${esc(o.paymentStatus||'Unpaid')}</div><span class="pill ${o.status==='Delivered'?'good':o.status==='Cancelled'?'bad':'warn'}">${esc(o.status)}</span></div><div class="actions"><button class="btn smallbtn" data-action="openOrder" data-id="${o.id}">Open</button><button class="btn secondary smallbtn" data-action="editOrder" data-id="${o.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteOrder" data-id="${o.id}">Delete</button></div></div></div>`}).join(''):'<div class="empty">No matching orders.</div>'}
function prospectList(search){const arr=state.prospects.filter(p=>(p.business+' '+p.area+' '+p.status).toLowerCase().includes(search.toLowerCase()));return arr.length?arr.map(p=>`<div class="subcard"><div class="row wraprow"><div><b>${esc(p.business)}</b><div class="small muted">${esc(p.area||'')} • ${esc(p.phone||'')} • ${esc(p.status||'New')}</div><div>${esc(p.notes||'')}</div></div><div class="actions"><button class="btn secondary smallbtn" data-action="editProspect" data-id="${p.id}">Edit</button><button class="btn danger smallbtn" data-action="deleteProspect" data-id="${p.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No prospects.</div>'}
function field(label,id,value='',type='text',extra=''){return `<label class="label">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`}
function selectField(label,id,value,opts){return `<label class="label">${label}</label><select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
const actions={

editStock(d){const m=state.machines.find(x=>x.id===d.id);const rows=state.products.filter(p=>p.active!==false).map(p=>{const s=state.machineStock.find(x=>x.machineId===m.id&&x.productId===p.id)||{qty:0,par:0,sold:0};return `<div class="product">${productPhoto(p)}<div><b>${esc(p.name)}</b><div class="grid3">${field('Stock','q_'+p.id,s.qty,'number','min="0" inputmode="numeric"')}${field('Par','par_'+p.id,s.par,'number','min="0" inputmode="numeric"')}${field('Sold','sold_'+p.id,s.sold,'number','min="0" inputmode="numeric"')}</div></div><button class="btn secondary smallbtn" data-stockscan="${p.id}">Scan +1</button></div>`}).join('');openModal('Edit Stock • '+m.name,`<div class="small muted">Type exact numbers for stock, par and sold. Scan adds one unit.</div>${rows}<button class="btn secondary" id="addFromStock" style="width:100%;margin-top:10px">Add New Product</button>`,()=>{state.products.filter(p=>p.active!==false).forEach(p=>{const qty=Math.max(0,Number(document.getElementById('q_'+p.id)?.value||0)),par=Math.max(0,Number(document.getElementById('par_'+p.id)?.value||0)),sold=Math.max(0,Number(document.getElementById('sold_'+p.id)?.value||0));let s=state.machineStock.find(x=>x.machineId===m.id&&x.productId===p.id);if(!s){s={id:uid(),machineId:m.id,productId:p.id,qty,par,sold};state.machineStock.push(s)}else Object.assign(s,{qty,par,sold});});persist('Updated machine stock for '+m.name,'machine',m.id);closeModal();render();});setTimeout(()=>{document.querySelectorAll('[data-stockscan]').forEach(b=>b.onclick=()=>startScanner(code=>{const p=state.products.find(p=>p.barcode===code);if(!p)return toast('Barcode not found.');const el=document.getElementById('q_'+p.id);if(el)el.value=Number(el.value||0)+1;else toast('Product is inactive or not visible.');}));document.getElementById('addFromStock').onclick=()=>{closeModal();actions.addProduct();};},0);},
addProduct(){productForm();},editProduct(d){productForm(state.products.find(x=>x.id===d.id));},adjustInventory(d){const p=state.products.find(x=>x.id===d.id);openModal('Adjust Inventory • '+p.name,`${field('Exact on-hand quantity','adjQty',p.onHand,'number','min="0" inputmode="numeric"')}<label class="label">Reason</label><select id="adjReason"><option>Count correction</option><option>Purchase received</option><option>Damage</option><option>Expiration</option><option>Missing</option><option>Return</option></select>`,()=>{const old=p.onHand;p.onHand=Math.max(0,Number(document.getElementById('adjQty').value||0));persist(`Adjusted ${p.name} from ${old} to ${p.onHand}`,'product',p.id);closeModal();render();});},deleteProduct(d){const p=state.products.find(x=>x.id===d.id);if(p&&confirmDelete(p.name)){state.products=state.products.filter(x=>x.id!==d.id);state.machineStock=state.machineStock.filter(x=>x.productId!==d.id);persist('Deleted product '+p.name,'product',d.id);render();}},
newOrder(){orderForm();},editOrder(d){orderForm(state.orders.find(x=>x.id===d.id));},deleteOrder(d){const o=state.orders.find(x=>x.id===d.id);if(o&&confirmDelete(o.number)){state.orders=state.orders.filter(x=>x.id!==d.id);state.routes.forEach(r=>r.orderIds=r.orderIds.filter(id=>id!==d.id));persist('Deleted order '+o.number,'order',d.id);render();}},openOrder(d){openOrderView(state.orders.find(x=>x.id===d.id));},
newRoute(){routeForm();},editRoute(d){routeForm(state.routes.find(x=>x.id===d.id));},deleteRoute(d){const r=state.routes.find(x=>x.id===d.id);if(r&&confirmDelete(r.name)){state.routes=state.routes.filter(x=>x.id!==d.id);persist('Deleted route '+r.name,'route',d.id);render();}},openRoute(d){openRouteView(state.routes.find(x=>x.id===d.id));},
addSale(){saleForm();},editSale(d){saleForm(state.sales.find(x=>x.id===d.id));},deleteSale(d){const s=state.sales.find(x=>x.id===d.id);if(s&&confirmDelete('sale record')){state.sales=state.sales.filter(x=>x.id!==d.id);persist('Deleted sale record','sale',d.id);render();}},
addIssue(){issueForm();},editIssue(d){issueForm(state.issues.find(x=>x.id===d.id));},deleteIssue(d){const i=state.issues.find(x=>x.id===d.id);if(i&&confirmDelete('issue')){state.issues=state.issues.filter(x=>x.id!==d.id);persist('Deleted issue','issue',d.id);render();}},
addProspect(){prospectForm();},editProspect(d){prospectForm(state.prospects.find(x=>x.id===d.id));},deleteProspect(d){const p=state.prospects.find(x=>x.id===d.id);if(p&&confirmDelete(p.business)){state.prospects=state.prospects.filter(x=>x.id!==d.id);persist('Deleted prospect '+p.business,'prospect',d.id);render();}},
exportInventory(){downloadCSV('inventory.csv',state.products.map(p=>({SKU:p.sku,Barcode:p.barcode,Product:p.name,Category:p.category,Cost:p.cost,Price:p.price,OnHand:p.onHand,Reorder:p.reorder,Supplier:p.supplier})));},exportOrders(){downloadCSV('orders.csv',state.orders.map(o=>({Order:o.number,Customer:o.customerName,Phone:o.phone,Address:o.address,DeliveryDate:o.deliveryDate,Status:o.status,Payment:o.paymentStatus,Items:o.items.reduce((a,i)=>a+i.qty,0)})));},exportSales(){downloadCSV('sales.csv',state.sales);},exportActivity(){downloadCSV('activity.csv',state.activity);},manualSync(){syncCloud(true);},makeBackup(){makeSnapshot();toast('Backup snapshot created.');render();},exportBackup(){downloadFile('str8-vending-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');},installApp(){installPwa();},resetDemo(){if(confirm('Reset this device to clean demo data?')){state=starter();localStorage.setItem(LS,JSON.stringify(state));logActivity('Reset demo data');render();}},restoreSnapshot(d){const b=getBackups()[Number(d.index)];if(b&&confirm('Restore this snapshot?')){state=b.data;persist('Restored local snapshot','backup','');render();}}

function machineForm(m={}){openModal(m.id?'Edit Machine':'Add Machine',`<div class="grid2">${field('Machine name','mName',m.name||'')}${selectField('Status','mStatus',m.status||'Active',['Active','Prospect','Service Needed','Inactive'])}${field('Location','mLocation',m.location||'')}${field('Address','mAddress',m.address||'')}${field('Machine type','mType',m.type||'Combo')}${field('Serial number','mSerial',m.serial||'')}${field('Card reader ID','mReader',m.reader||'')}${field('Service day','mDay',m.serviceDay||'')}</div><label class="label">Notes</label><textarea id="mNotes">${esc(m.notes||'')}</textarea>`,()=>{const x=m.id?m:{id:uid()};Object.assign(x,{name:val('mName'),status:val('mStatus'),location:val('mLocation'),address:val('mAddress'),type:val('mType'),serial:val('mSerial'),reader:val('mReader'),serviceDay:val('mDay'),notes:val('mNotes')});if(!m.id)state.machines.push(x);persist((m.id?'Updated':'Added')+' machine '+x.name,'machine',x.id);closeModal();render();});}
function productForm(p={}){openModal(p.id?'Edit Product':'Add Product',`<div class="grid2">${field('Product name','pName',p.name||'')}${field('SKU','pSku',p.sku||'')}${field('Barcode / UPC','pBarcode',p.barcode||'','text','inputmode="numeric"')}${field('Category','pCategory',p.category||'')}${field('Unit cost','pCost',p.cost||0,'number','step="0.01" min="0"')}${field('Sale price','pPrice',p.price||0,'number','step="0.01" min="0"')}${field('On hand','pOnHand',p.onHand||0,'number','min="0" inputmode="numeric"')}${field('Reorder level','pReorder',p.reorder||0,'number','min="0" inputmode="numeric"')}${field('Reorder quantity','pReorderQty',p.reorderQty||0,'number','min="0" inputmode="numeric"')}${field('Supplier','pSupplier',p.supplier||'')}</div><label class="label">Product photo</label><input id="pPhoto" type="file" accept="image/*" capture="environment"><div class="actions" style="margin-top:8px"><button class="btn secondary smallbtn" type="button" id="scanProductBarcode">Scan Barcode</button></div>${p.photo?`<img class="photo" style="margin-top:10px" src="${p.photo}">`:''}<label class="checkline" style="margin-top:10px"><input id="pActive" type="checkbox" ${p.active!==false?'checked':''}> Active product</label>`,async()=>{const x=p.id?p:{id:uid()};let photo=p.photo||'';const f=document.getElementById('pPhoto').files[0];if(f)photo=await compressImage(f);Object.assign(x,{name:val('pName'),sku:val('pSku'),barcode:val('pBarcode'),category:val('pCategory'),cost:num('pCost'),price:num('pPrice'),onHand:intv('pOnHand'),reorder:intv('pReorder'),reorderQty:intv('pReorderQty'),supplier:val('pSupplier'),photo,active:document.getElementById('pActive').checked});if(!p.id)state.products.push(x);persist((p.id?'Updated':'Added')+' product '+x.name,'product',x.id);closeModal();render();});setTimeout(()=>document.getElementById('scanProductBarcode').onclick=()=>startScanner(code=>document.getElementById('pBarcode').value=code),0);}
function orderForm(o={}){const items=(o.items||[]).map(i=>({...i}));const customerOptions=state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');openModal(o.id?'Edit Order':'New Order',`${field('Customer name','oCustomer',o.customerName||'')}${field('Phone','oPhone',o.phone||'','tel')}${field('Delivery address','oAddress',o.address||'')}<div class="grid2">${field('Delivery date','oDate',o.deliveryDate||new Date().toISOString().slice(0,10),'date')}${selectField('Payment status','oPayment',o.paymentStatus||'Unpaid',['Unpaid','Paid','COD','Invoice'])}</div><label class="label">Delivery notes</label><textarea id="oNotes">${esc(o.notes||'')}</textarea><div class="row" style="margin-top:12px"><h3>Items</h3><div class="actions"><button type="button" class="btn secondary smallbtn" id="scanOrderItem">Scan Item</button><button type="button" class="btn smallbtn" id="addOrderItem">Add Item</button></div></div><div id="orderItems"></div>`,()=>{const x=o.id?o:{id:uid(),number:'ORD-'+String(Date.now()).slice(-6),status:'New',createdAt:new Date().toISOString(),proof:{}};Object.assign(x,{customerName:val('oCustomer'),phone:val('oPhone'),address:val('oAddress'),deliveryDate:val('oDate'),paymentStatus:val('oPayment'),notes:val('oNotes'),items});if(!o.id)state.orders.push(x);upsertCustomer(x);persist((o.id?'Updated':'Created')+' order '+x.number,'order',x.id);closeModal();render();});function draw(){document.getElementById('orderItems').innerHTML=items.length?items.map((i,idx)=>{const p=state.products.find(p=>p.id===i.productId);return `<div class="product">${productPhoto(p||{})}<div><b>${esc(p?.name||'Missing product')}</b>${field('Quantity','oi_'+idx,i.qty,'number','min="1" inputmode="numeric"')}</div><button type="button" class="btn danger smallbtn" data-rm="${idx}">Remove</button></div>`}).join(''):'<div class="empty">No items yet.</div>';document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{items.splice(Number(b.dataset.rm),1);draw();});items.forEach((i,idx)=>document.getElementById('oi_'+idx).oninput=e=>i.qty=Math.max(1,Number(e.target.value||1)));}
setTimeout(()=>{draw();document.getElementById('addOrderItem').onclick=()=>chooseProduct(p=>{const ex=items.find(i=>i.productId===p.id);if(ex)ex.qty++;else items.push({productId:p.id,qty:1,picked:0});draw();});document.getElementById('scanOrderItem').onclick=()=>startScanner(code=>{const p=state.products.find(p=>p.barcode===code);if(!p)return toast('Barcode not found.');const ex=items.find(i=>i.productId===p.id);if(ex)ex.qty++;else items.push({productId:p.id,qty:1,picked:0});draw();});},0);}
function chooseProduct(cb){openModal('Choose Product',state.products.filter(p=>p.active!==false).map(p=>`<button type="button" class="subcard" data-pick="${p.id}" style="width:100%;color:white;text-align:left">${productPhoto(p)}<b>${esc(p.name)}</b><div class="small">${esc(p.sku)} • On hand ${p.onHand}</div></button>`).join(''),()=>{},'Close');document.getElementById('saveModal').style.display='none';setTimeout(()=>document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.id===b.dataset.pick);closeModal();document.getElementById('saveModal').style.display='';cb(p);}),0);}
function openOrderView(o){function html(){return `<div class="row wraprow"><div><b>${esc(o.number)} • ${esc(o.customerName)}</b><div class="small muted">${esc(o.address)} • ${esc(o.phone)}</div></div><span class="pill warn">${esc(o.status)}</span></div>${o.items.map(i=>{const p=state.products.find(p=>p.id===i.productId);return `<div class="product">${productPhoto(p||{})}<div><b>${esc(p?.name||'Missing')}</b><div>Picked <b>${i.picked||0}</b> of <b>${i.qty}</b></div><div class="small muted">Warehouse ${p?.onHand||0}</div></div><div class="actions"><button type="button" class="btn secondary smallbtn" data-pickone="${i.productId}">Pick +1</button><button type="button" class="btn smallbtn" data-scanpick="${i.productId}">Scan</button></div></div>`}).join('')}<div class="grid2"><button type="button" class="btn secondary" id="setPicking">Set Picking</button><button type="button" class="btn good" id="setReady">Mark Ready</button></div>`}openModal('Order Picking',html(),()=>{closeModal();render();},'Done');function rebind(){document.querySelectorAll('[data-pickone]').forEach(b=>b.onclick=()=>pickProduct(o,b.dataset.pickone));document.querySelectorAll('[data-scanpick]').forEach(b=>b.onclick=()=>startScanner(code=>{const p=state.products.find(p=>p.barcode===code);if(!p||p.id!==b.dataset.scanpick)return toast('Wrong product scanned.');pickProduct(o,p.id);}));document.getElementById('setPicking').onclick=()=>{o.status='Picking';persist('Order set to Picking','order',o.id);toast('Status updated.');};document.getElementById('setReady').onclick=()=>{if(o.items.some(i=>(i.picked||0)<i.qty))return toast('Finish picking every item first.');o.status='Ready';persist('Order marked Ready','order',o.id);closeModal();render();};}setTimeout(rebind,0);}
function pickProduct(o,pid){const i=o.items.find(i=>i.productId===pid),p=state.products.find(p=>p.id===pid);if(!i||!p)return;if((i.picked||0)>=i.qty)return toast('Item already fully picked.');if(p.onHand<=0)return toast('No warehouse stock available.');i.picked=(i.picked||0)+1;p.onHand--;o.status='Picking';persist('Picked 1 '+p.name+' for '+o.number,'order',o.id);closeModal();openOrderView(o);}
function routeForm(r={}){const eligible=state.orders.filter(o=>!['Checked In','Cancelled'].includes(o.status));openModal(r.id?'Edit Route':'Create Route',`${field('Route name','rName',r.name||'Route '+new Date().toLocaleDateString())}<div class="grid2">${field('Date','rDate',r.date||new Date().toISOString().slice(0,10),'date')}${field('Driver','rDriver',r.driver||profile?.display_name||'')}</div><label class="label">Select orders</label>${eligible.map(o=>`<label class="checkline subcard"><input type="checkbox" data-routeorder="${o.id}" ${(r.orderIds||[]).includes(o.id)?'checked':''}><span><b>${esc(o.number)} • ${esc(o.customerName)}</b><div class="small muted">${esc(o.address)}</div></span></label>`).join('')||'<div class="empty">No available orders.</div>'}`,()=>{const x=r.id?r:{id:uid(),status:'Planned'};Object.assign(x,{name:val('rName'),date:val('rDate'),driver:val('rDriver'),orderIds:[...document.querySelectorAll('[data-routeorder]:checked')].map(e=>e.dataset.routeorder)});if(!r.id)state.routes.push(x);persist((r.id?'Updated':'Created')+' route '+x.name,'route',x.id);closeModal();render();});}
function routeStopInventory(o){if(!o.checkIn)return '';const items=o.items||[];return `<div class="subcard" style="margin-top:10px;border-color:#17613d"><div class="row wraprow"><div><b>Inventory to take inside</b><div class="small muted">This list appeared after check-in.</div></div><span class="pill good">${items.reduce((n,i)=>n+Number(i.qty||0),0)} total items</span></div>${items.length?items.map(i=>{const p=state.products.find(p=>p.id===i.productId)||{};return `<div class="product">${productPhoto(p)}<div><b>${esc(p.name||'Missing product')}</b><div class="small muted">${esc(p.sku||'No SKU')} • Barcode ${esc(p.barcode||'Not set')}</div></div><div style="text-align:right"><div class="small muted">Take inside</div><b style="font-size:26px">${Number(i.qty||0)}</b></div></div>`}).join(''):'<div class="empty">No inventory was added to this stop.</div>'}<button type="button" class="btn secondary" data-openpick="${o.id}" style="width:100%;margin-top:10px">Open Picking List</button></div>`;}
function openRouteView(r){const orders=r.orderIds.map(id=>state.orders.find(o=>o.id===id)).filter(Boolean);openModal(r.name,`<div class="row"><span>${esc(r.date)} • ${esc(r.driver||'Unassigned')}</span><span class="pill ${r.status==='Completed'?'good':'warn'}">${esc(r.status)}</span></div>${orders.map((o,idx)=>{const c=o.checkIn;const checkInfo=c?`<div class="small good" style="margin-top:7px">Checked in ${new Date(c.timestamp).toLocaleString()} • Accuracy ±${Math.round(c.accuracy||0)}m</div><a class="small blue" href="https://maps.apple.com/?ll=${c.latitude},${c.longitude}" target="_blank">View logged location</a>`:'';return `<div class="subcard route-stop"><b>Stop ${idx+1}: ${esc(o.customerName)}</b><div>${esc(o.address)}</div><div class="small muted">${esc(o.phone)} • ${esc(o.number)} • ${esc(o.status)}</div>${checkInfo}<div class="actions" style="margin-top:8px"><a class="btn secondary smallbtn" href="https://maps.apple.com/?q=${encodeURIComponent(o.address)}" target="_blank">Navigate</a><button type="button" class="btn ${c?'good':''} smallbtn" data-checkin="${o.id}">${c?'Check In Again':'Check In'}</button></div>${routeStopInventory(o)}</div>`}).join('')||'<div class="empty">No stops.</div>'}<button type="button" class="btn good" id="completeRoute" style="width:100%">Complete Route</button>`,()=>{closeModal();render();},'Close');setTimeout(()=>{document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>checkInAtStop(state.orders.find(o=>o.id===b.dataset.checkin),r,b));document.querySelectorAll('[data-openpick]').forEach(b=>b.onclick=()=>{const o=state.orders.find(o=>o.id===b.dataset.openpick);closeModal();openOrderView(o);});document.getElementById('completeRoute').onclick=()=>{if(orders.some(o=>!o.checkIn))return toast('Check in at every stop before completing the route.');r.status='Completed';persist('Completed route '+r.name,'route',r.id);closeModal();render();};},0);}
function checkInAtStop(o,r,button){if(!o)return toast('Stop not found.');if(!navigator.geolocation)return toast('Location services are not supported on this device.');const original=button?.textContent||'Check In';if(button){button.disabled=true;button.textContent='Getting Location...';}navigator.geolocation.getCurrentPosition(pos=>{const c=pos.coords;o.checkIn={latitude:Number(c.latitude),longitude:Number(c.longitude),accuracy:Number(c.accuracy||0),altitude:c.altitude==null?null:Number(c.altitude),timestamp:new Date(pos.timestamp||Date.now()).toISOString(),address:o.address||'',machineName:o.customerName||''};o.status='Checked In';persist('Checked in at '+(o.customerName||o.number),'checkin',o.id);closeModal();openRouteView(r);toast('Check-in saved with current GPS location.');},err=>{if(button){button.disabled=false;button.textContent=original;}const msg=err.code===1?'Location permission was denied. Allow location access in Safari settings.':err.code===2?'Current location is unavailable. Move to an open area and try again.':'Location request timed out. Try again.';toast(msg);},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}
function saleForm(s={}){openModal(s.id?'Edit Sale':'Add Sale',`<div class="grid2">${field('Date','sDate',s.date||new Date().toISOString().slice(0,10),'date')}${field('Location / machine','sLocation',s.location||'')}${field('Cash sales','sCash',s.cash||0,'number','step="0.01" min="0"')}${field('Card sales','sCard',s.card||0,'number','step="0.01" min="0"')}${field('Product cost','sCost',s.cost||0,'number','step="0.01" min="0"')}${field('Commission paid','sCommission',s.commission||0,'number','step="0.01" min="0"')}</div><label class="label">Notes</label><textarea id="sNotes">${esc(s.notes||'')}</textarea>`,()=>{const x=s.id?s:{id:uid()};Object.assign(x,{date:val('sDate'),location:val('sLocation'),cash:num('sCash'),card:num('sCard'),cost:num('sCost'),commission:num('sCommission'),notes:val('sNotes')});if(!s.id)state.sales.push(x);persist((s.id?'Updated':'Added')+' sales record','sale',x.id);closeModal();render();});}
function issueForm(i={}){openModal(i.id?'Edit Issue':'Record Issue',`<div class="grid2">${selectField('Type','iType',i.type||'Damaged',['Return','Damaged','Expired','Missing','Refund'])}${selectField('Status','iStatus',i.status||'Open',['Open','Investigating','Resolved'])}${field('Date','iDate',i.date||new Date().toISOString().slice(0,10),'date')}${field('Location','iLocation',i.location||'')}${field('Product','iProduct',i.productName||'')}${field('Quantity','iQty',i.qty||0,'number','min="0" inputmode="numeric"')}</div><label class="label">Notes</label><textarea id="iNotes">${esc(i.notes||'')}</textarea>`,()=>{const x=i.id?i:{id:uid()};Object.assign(x,{type:val('iType'),status:val('iStatus'),date:val('iDate'),location:val('iLocation'),productName:val('iProduct'),qty:intv('iQty'),notes:val('iNotes')});if(!i.id)state.issues.push(x);persist((i.id?'Updated':'Recorded')+' '+x.type+' issue','issue',x.id);closeModal();render();});}
function prospectForm(p={}){openModal(p.id?'Edit Prospect':'Add Prospect',`<div class="grid2">${field('Business','prBusiness',p.business||'')}${field('Contact','prContact',p.contact||'')}${field('Phone','prPhone',p.phone||'','tel')}${field('Area','prArea',p.area||'')}${field('Address','prAddress',p.address||'')}${selectField('Status','prStatus',p.status||'New',['New','Called','Interested','Visit Set','Agreement Sent','Won','Not Interested','Bad Number','Closed'])}${field('Follow-up','prFollow',p.followUp||'','date')}${field('Source','prSource',p.source||'')}</div><label class="label">Notes</label><textarea id="prNotes">${esc(p.notes||'')}</textarea>`,()=>{const x=p.id?p:{id:uid()};Object.assign(x,{business:val('prBusiness'),contact:val('prContact'),phone:val('prPhone'),area:val('prArea'),address:val('prAddress'),status:val('prStatus'),followUp:val('prFollow'),source:val('prSource'),notes:val('prNotes')});if(!p.id)state.prospects.push(x);persist((p.id?'Updated':'Added')+' prospect '+x.business,'prospect',x.id);closeModal();render();});}
function upsertCustomer(o){let c=state.customers.find(c=>c.name.toLowerCase()===o.customerName.toLowerCase());if(!c){c={id:uid(),name:o.customerName};state.customers.push(c)}Object.assign(c,{phone:o.phone,address:o.address,notes:o.notes});}
function val(id){return document.getElementById(id)?.value.trim()||''}function num(id){return Number(document.getElementById(id)?.value||0)}function intv(id){return Math.max(0,parseInt(document.getElementById(id)?.value||0,10)||0)}
function downloadCSV(name,rows){if(!rows.length)return toast('Nothing to export.');const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\n');downloadFile(name,csv,'text/csv');}
function downloadFile(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function getBackups(){try{return JSON.parse(localStorage.getItem(BACKUPS)||'[]')}catch(e){return []}}function makeSnapshot(){const b=getBackups();b.unshift({at:new Date().toISOString(),data:JSON.parse(JSON.stringify(state))});localStorage.setItem(BACKUPS,JSON.stringify(b.slice(0,10)));}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});async function installPwa(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else toast('Use Safari Share → Add to Home Screen.');}
async function syncCloud(show=true){if(!sb||!navigator.onLine){if(show)toast('Offline. Changes are saved locally.');return;}try{makeSnapshot();const {data,error}=await sb.from('stb_one_state').select('data,version,updated_at').eq('id','main').single();if(error)throw error;const remote=data?.data||{};const remoteTime=new Date(data?.updated_at||0).getTime(),localTime=new Date(state.updatedAt||0).getTime();if(remoteTime>localTime&&!state.pendingSync){state=Object.assign(starter(),remote);localStorage.setItem(LS,JSON.stringify(state));}else{const nextVersion=Number(data?.version||0)+1;const {error:e2}=await sb.from('stb_one_state').upsert({id:'main',data:state,version:nextVersion,updated_at:new Date().toISOString()});if(e2)throw e2;}state.pendingSync=false;state.lastSync=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(state));renderNetwork();if(show)toast('Cloud sync complete.');}catch(e){console.error(e);if(show)toast('Cloud sync failed. Your changes are safe on this device.');}}
async function login(){const email=val('loginEmail'),password=document.getElementById('loginPassword').value;if(!sb)return setLoginMsg('Cloud service failed to load.');if(!email||!password)return setLoginMsg('Enter your email and password.');setLoginMsg('Signing in...');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){const msg=String(error.message||'Login failed.');if(/invalid login credentials/i.test(msg))return setLoginMsg('Wrong email or password. Tap Reset Password to create a new password.');return setLoginMsg(msg);}user=data.user;demo=false;await loadProfile();showApp();await syncCloud(false);render();}
async function sendPasswordReset(){const email=val('loginEmail');if(!sb)return setLoginMsg('Cloud service failed to load.');if(!email)return setLoginMsg('Enter your email first, then tap Reset Password.');setLoginMsg('Sending password reset email...');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return setLoginMsg(error.message);setLoginMsg('Password reset email sent. Open the email link, return here, and choose your new password.');}
async function finishPasswordRecovery(){const next=prompt('Enter your new password (at least 6 characters):');if(!next)return setLoginMsg('Password update cancelled.');if(next.length<6)return setLoginMsg('Password must be at least 6 characters.');const {error}=await sb.auth.updateUser({password:next});if(error)return setLoginMsg(error.message);setLoginMsg('Password updated. You can now sign in with the new password.');await sb.auth.signOut();}
async function loadProfile(){const {data}=await sb.from('stb_profiles').select('*').eq('user_id',user.id).maybeSingle();profile=data||{email:user.email,display_name:user.email,role:'owner'};}
function setLoginMsg(s){document.getElementById('loginMsg').textContent=s}
function showApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLine').textContent=`${profile?.display_name||profile?.email||'Demo User'} • ${role().toUpperCase()}`;renderNetwork();render();}
async function logout(){toast('Password login is turned off.');currentPage='dashboard';render();}
function bindGlobal(){document.getElementById('loginBtn').onclick=login;document.getElementById('resetPasswordBtn').onclick=sendPasswordReset;document.getElementById('demoBtn').onclick=()=>{demo=true;profile={email:'demo@local',display_name:'Demo User',role:'owner'};showApp();};document.getElementById('logoutBtn').onclick=logout;document.getElementById('syncBtn').onclick=()=>syncCloud(true);document.getElementById('closeModal').onclick=closeModal;document.getElementById('saveModal').onclick=async()=>{if(modalSave)await modalSave();};document.getElementById('closeScanner').onclick=stopScanner;document.getElementById('useBarcode').onclick=()=>finishScan(val('manualBarcode'));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};window.addEventListener('online',()=>{renderNetwork();syncCloud(false)});window.addEventListener('offline',renderNetwork);document.addEventListener('input',e=>{if(e.target.id==='inventorySearch'||e.target.id==='inventoryFilter')document.getElementById('inventoryList').innerHTML=inventoryList(document.getElementById('inventorySearch').value,document.getElementById('inventoryFilter').value);if(e.target.id==='orderSearch'||e.target.id==='orderStatus')document.getElementById('orderList').innerHTML=orderList(document.getElementById('orderSearch').value,document.getElementById('orderStatus').value);if(e.target.id==='prospectSearch')document.getElementById('prospectList').innerHTML=prospectList(e.target.value);bindPage();});document.addEventListener('change',async e=>{if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(confirm('Restore this backup and replace current data?')){state=Object.assign(starter(),data);persist('Restored backup file','backup','');render();}}catch(err){toast('Invalid backup file.')}}});}
async function init(){bindGlobal();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});document.getElementById('loginScreen').classList.add('hidden');demo=false;user={email:'owner@stbdistribution.com'};profile={email:'owner@stbdistribution.com',display_name:'STB Owner',role:'owner'};showApp();await syncCloud(false);render();}
bindGlobal();init();
</script>
</body>
