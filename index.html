const defaultData={prospects:STARTER_PROSPECTS,machines:[{id:'M001',name:'Warehouse 1',sales:{water:14,chips:8},stock:{water:6,chips:4},par:{water:24,chips:18}}],inventory:{water:100,chips:75},products:{water:'Bottled Water',chips:'Chips'}};
let data;try{data=JSON.parse(localStorage.getItem('str8_vending_data_v2')||'null')}catch(e){data=null}data=data&&typeof data==='object'?data:{};if(!Array.isArray(data.prospects)||!data.prospects.length)data.prospects=STARTER_PROSPECTS.map(p=>({...p}));if(!Array.isArray(data.machines))data.machines=defaultData.machines.map(m=>JSON.parse(JSON.stringify(m)));if(!data.inventory||typeof data.inventory!=='object')data.inventory={...defaultData.inventory};if(!data.products||typeof data.products!=='object')data.products={...defaultData.products};data.machines=data.machines.map((m,i)=>({id:m.id||('M'+String(i+1).padStart(3,'0')),name:m.name||('Machine '+(i+1)),sales:m.sales&&typeof m.sales==='object'?m.sales:{},stock:m.stock&&typeof m.stock==='object'?m.stock:{},par:m.par&&typeof m.par==='object'?m.par:{}}));
let editingId=null;
function save(){localStorage.setItem('str8_vending_data_v2',JSON.stringify(data));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function showPage(page){document.querySelectorAll('[data-page]').forEach(b=>b.style.background=b.dataset.page===page?'#b52543':'#17243a');const c=document.getElementById('content');if(page==='dashboard'){let sales=0;data.machines.forEach(m=>Object.values(m.sales).forEach(v=>sales+=v));let hot=data.prospects.filter(p=>['Interested','Visit Set','Agreement Sent'].includes(p.status)).length;let won=data.prospects.filter(p=>p.status==='Won').length;c.innerHTML='<h3>Dashboard</h3><div class=row><span>Machines</span><b>'+data.machines.length+'</b></div><div class=row><span>Units Sold</span><b>'+sales+'</b></div><div class=row><span>Prospects</span><b>'+data.prospects.length+'</b></div><div class=row><span>Hot Leads</span><b>'+hot+'</b></div><div class=row><span>Won Locations</span><b>'+won+'</b></div>';}else if(page==='machines'){c.innerHTML='<h3>Machines</h3>'+data.machines.map(m=>'<div class=row><span>'+esc(m.id)+' — '+esc(m.name)+'</span><b>Active</b></div>').join('');}else if(page==='inventory'){c.innerHTML='<h3>Warehouse Inventory</h3>'+Object.keys(data.inventory).map(k=>'<div class=row><span>'+esc(data.products[k])+'</span><b>'+data.inventory[k]+'</b></div>').join('');}else if(page==='restock'){let rows=[];data.machines.forEach(m=>Object.keys(m.par).forEach(k=>{let need=Math.max(0,m.par[k]-m.stock[k]);if(need)rows.push('<div class=row><span>'+esc(m.id)+' · '+esc(data.products[k])+'</span><b>'+need+'</b></div>')}));c.innerHTML='<h3>What Goes to Which Machine</h3>'+(rows.join('')||'<p class=good>All machines are fully stocked.</p>');}else renderProspects();}
function renderProspects(){const c=document.getElementById('content');let areas=[...new Set(data.prospects.map(p=>p.area).filter(Boolean))].sort();c.innerHTML='<div class=row><div><h3 style="margin:0">Prospects</h3><div class="muted small">'+data.prospects.length+' Charleston-area leads</div></div><button class="btn" id="addP" style="width:auto">+ Add</button></div><div class=filters><input id="pSearch" placeholder="Search business, phone, area, category"><select id="pFilter"><option value="">All statuses</option><option>No</option><option>Called</option><option>Interested</option><option>Visit Set</option><option>Agreement Sent</option><option>Won</option><option>Not Interested</option><option>Bad Number</option><option>Closed</option></select></div><div class=filters3><select id="pArea"><option value="">All areas</option>'+areas.map(a=>'<option>'+esc(a)+'</option>').join('')+'</select><select id="pPriority"><option value="">All priorities</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="pVerified"><option value="">All verification</option><option value="verified">Verified online</option><option value="verify">Needs verification</option></select></div><div id="pList"></div>';['pSearch','pFilter','pArea','pPriority','pVerified'].forEach(id=>document.getElementById(id).addEventListener(id==='pSearch'?'input':'change',drawProspects));document.getElementById('addP').onclick=()=>openProspect();drawProspects();}
function drawProspects(){let q=(document.getElementById('pSearch').value||'').toLowerCase(),f=document.getElementById('pFilter').value,a=document.getElementById('pArea').value,pr=document.getElementById('pPriority').value,v=document.getElementById('pVerified').value;let list=data.prospects.filter(p=>(!q||[p.business,p.category,p.area,p.address,p.phone,p.contact,p.notes].join(' ').toLowerCase().includes(q))&&(!f||p.status===f)&&(!a||p.area===a)&&(!pr||p.priority===pr)&&(!v||(v==='verified'?String(p.verification).toLowerCase().includes('verified'):!String(p.verification).toLowerCase().includes('verified')))).sort((x,y)=>({Easy:0,Medium:1,Hard:2}[x.priority]??9)-({Easy:0,Medium:1,Hard:2}[y.priority]??9)||x.business.localeCompare(y.business));document.getElementById('pList').innerHTML=list.map(p=>'<div class=prospect><div class=ptop><div><b>'+esc(p.business)+'</b><div class="muted small">'+esc(p.category)+' · '+esc(p.area)+'</div></div><span class="pill '+String(p.priority).toLowerCase()+'">'+esc(p.priority)+'</span></div><div class=small style="margin-top:7px">'+esc(p.address)+'</div><div class=small style="margin-top:5px">'+(p.phone?'<a class=good href="tel:'+String(p.phone).replace(/\D/g,'')+'">'+esc(p.phone)+'</a>':'No phone listed')+'</div><div class="small muted" style="margin-top:6px">'+esc(p.verification||'Needs verification')+'</div><div class=row><span>Status</span><b>'+esc(p.status||'No')+'</b></div>'+(p.followUp?'<div class=row><span>Follow-up</span><b>'+esc(p.followUp)+'</b></div>':'')+'<div class=actions><button type=button class=btn data-edit-id="'+p.id+'">Edit</button>'+(p.phone?'<a class=btn href="tel:'+String(p.phone).replace(/\D/g,'')+'">Call</a>':'<button class=btn disabled>No Phone</button>')+(p.source?'<a class=btn href="'+esc(p.source)+'" target="_blank" rel="noopener">Source</a>':'<button class=btn disabled>No Source</button>')+'</div></div>').join('')||'<p class=muted>No matching prospects.</p>';}
function openProspect(id){editingId=id||null;let p=id?data.prospects.find(x=>x.id===id):{priority:'Easy',status:'No'};document.getElementById('modalTitle').textContent=id?'Edit Prospect':'Add Prospect';[['Business','business'],['Category','category'],['Area','area'],['Phone','phone'],['Address','address'],['Priority','priority'],['Status','status'],['Contact','contact'],['FollowUp','followUp'],['Verification','verification'],['Source','source'],['Notes','notes']].forEach(([field,key])=>document.getElementById('f'+field).value=p[key]||'');document.getElementById('prospectModal').classList.add('open');}
function closeModal(){document.getElementById('prospectModal').classList.remove('open');}
function saveProspect(){let business=document.getElementById('fBusiness').value.trim();if(!business)return alert('Business name is required.');let p={id:editingId||Date.now(),business,category:document.getElementById('fCategory').value.trim(),area:document.getElementById('fArea').value.trim(),phone:document.getElementById('fPhone').value.trim(),address:document.getElementById('fAddress').value.trim(),priority:document.getElementById('fPriority').value,status:document.getElementById('fStatus').value,contact:document.getElementById('fContact').value.trim(),followUp:document.getElementById('fFollowUp').value,verification:document.getElementById('fVerification').value.trim(),source:document.getElementById('fSource').value.trim(),notes:document.getElementById('fNotes').value.trim()};let i=data.prospects.findIndex(x=>x.id===p.id);if(i>=0)data.prospects[i]=p;else data.prospects.unshift(p);save();closeModal();renderProspects();}
function login(ev){if(ev&&ev.preventDefault)ev.preventDefault();try{const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),errEl=document.getElementById('err');const e=(emailEl&&emailEl.value||'').trim().toLowerCase(),p=(passEl&&passEl.value||'');if(e==='owner@stbdistribution.com'&&p==='1234'){try{localStorage.setItem('str8_login','1')}catch(_e){}document.getElementById('login').style.display='none';document.getElementById('app').classList.remove('hidden');document.getElementById('app').style.display='block';showPage('dashboard');return false;}if(errEl)errEl.textContent='Use owner@stbdistribution.com and password 1234.';}catch(ex){const errEl=document.getElementById('err');if(errEl)errEl.textContent='Sign-in error: '+(ex.message||ex);}return false;}window.str8Login=login;
function bindApp(){document.getElementById('logout').addEventListener('click',()=>showPage('dashboard'));document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)showPage(b.dataset.page)});document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('[data-edit-id]');if(b)openProspect(Number(b.dataset.editId))});document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('saveProspect').addEventListener('click',saveProspect);document.getElementById('prospectModal').addEventListener('click',e=>{if(e.target.id==='prospectModal')closeModal()});}bindApp();showPage('dashboard');
